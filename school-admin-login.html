<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>School Admin Login - Shule Portal Tanzania</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
    }

    .login-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-icon {
      font-size: 55px;
      margin-bottom: 8px;
    }

    .logo h1 {
      margin: 0;
      color: #1565c0;
      font-size: 25px;
    }

    .logo p {
      margin: 7px 0 0;
      color: #666;
      font-size: 14px;
    }

    .title {
      text-align: center;
      margin-bottom: 25px;
    }

    .title h2 {
      margin: 0;
      color: #222;
      font-size: 22px;
    }

    .title p {
      margin: 8px 0 0;
      color: #777;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #1565c0;
      box-shadow: 0 0 0 3px rgba(21,101,192,0.1);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 55px;
    }

    .show-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 20px;
      padding: 5px;
    }

    .login-button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      background: #1565c0;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 5px;
    }

    .login-button:hover {
      background: #0d47a1;
    }

    .login-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
    }

    .message.success {
      display: block;
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
    }

    .back-link {
      text-align: center;
      margin-top: 22px;
    }

    .back-link a {
      color: #1565c0;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

    .security-note {
      margin-top: 22px;
      background: #f5f7fa;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      font-size: 12px;
      color: #777;
      line-height: 1.5;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 10px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="login-card">

      <div class="logo">
        <div class="logo-icon">🏫</div>
        <h1>Shule Portal Tanzania</h1>
        <p>School Administration System</p>
      </div>

      <div class="title">
        <h2>🔐 School Admin Login</h2>
        <p>Ingia kusimamia shule yako</p>
      </div>

      <div id="message" class="message"></div>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">Barua pepe</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="mfano@gmail.com"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">

          <label for="password">Password</label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Ingiza password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="show-password"
              id="togglePassword"
              aria-label="Onyesha password"
            >
              👁️
            </button>

          </div>

        </div>

        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >
          Ingia
        </button>

        <div class="loading" id="loading">
          Inaingia kwenye mfumo...
        </div>

      </form>

      <div class="back-link">
        <a href="/schools-public.html">← Rudi kwenye Shule Portal</a>
      </div>

      <div class="security-note">
        🔒 Mfumo huu ni kwa School Admin pekee.
        Usishirikishe password yako na mtu mwingine.
      </div>

    </div>

  </div>

<script>

const API_BASE = window.location.origin;

const SCHOOL_ADMIN_TOKEN_KEY = "spt_school_admin_token";

const loginForm = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const loading = document.getElementById("loading");
const message = document.getElementById("message");
const togglePassword = document.getElementById("togglePassword");


/* =========================================================
   TOKEN FUNCTIONS
========================================================= */

function getSchoolAdminToken() {

  return (
    localStorage.getItem(SCHOOL_ADMIN_TOKEN_KEY) ||
    sessionStorage.getItem(SCHOOL_ADMIN_TOKEN_KEY) ||
    ""
  );

}


function saveSchoolAdminToken(token) {

  if (!token) {
    return false;
  }

  try {

    localStorage.setItem(
      SCHOOL_ADMIN_TOKEN_KEY,
      token
    );

  } catch (error) {

    console.error(
      "Imeshindikana kuhifadhi token kwenye localStorage:",
      error
    );

  }

  try {

    sessionStorage.setItem(
      SCHOOL_ADMIN_TOKEN_KEY,
      token
    );

  } catch (error) {

    console.warn(
      "sessionStorage haikupatikana."
    );

  }

  return true;

}


function clearSchoolAdminToken() {

  try {
    localStorage.removeItem(SCHOOL_ADMIN_TOKEN_KEY);
  } catch (error) {}

  try {
    sessionStorage.removeItem(SCHOOL_ADMIN_TOKEN_KEY);
  } catch (error) {}

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text, type = "error") {

  message.textContent = text;

  message.className = "message " + type;

}


function hideMessage() {

  message.textContent = "";

  message.className = "message";

}


/* =========================================================
   PASSWORD SHOW / HIDE
========================================================= */

togglePassword.addEventListener("click", () => {

  if (passwordInput.type === "password") {

    passwordInput.type = "text";

    togglePassword.textContent = "🙈";

  } else {

    passwordInput.type = "password";

    togglePassword.textContent = "👁️";

  }

});


/* =========================================================
   VERIFY EXISTING SESSION
   Kama token ipo na bado ni valid, dashboard moja kwa moja.
========================================================= */

async function checkExistingSession() {

  const token = getSchoolAdminToken();

  if (!token) {
    return false;
  }

  try {

    const response = await fetch(
      `${API_BASE}/api/school-admin/me`,
      {
        method: "GET",

        headers: {
          "Accept": "application/json",
          "Authorization": `Bearer ${token}`
        },

        credentials: "include",

        cache: "no-store"
      }
    );


    const data = await response.json().catch(() => ({}));


    if (
      response.ok &&
      data.success
    ) {

      window.location.replace(
        "/school-admin-dashboard.html"
      );

      return true;

    }


    /* Token ime-expire au si valid */

    clearSchoolAdminToken();

    return false;

  } catch (error) {

    console.warn(
      "Session check failed:",
      error
    );

    return false;

  }

}


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    hideMessage();

    const email = emailInput.value.trim();

    const password = passwordInput.value;


    if (!email || !password) {

      showMessage(
        "Tafadhali jaza email na password."
      );

      return;

    }


    loginButton.disabled = true;

    loginButton.textContent = "Inaingia...";

    loading.style.display = "block";


    try {

      /*
       * Safisha token ya zamani kwanza.
       */

      clearSchoolAdminToken();


      const response = await fetch(
        `${API_BASE}/api/school-admin/login`,
        {

          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },

          credentials: "include",

          cache: "no-store",

          body: JSON.stringify({
            email: email,
            password: password
          })

        }
      );


      const data = await response.json().catch(() => ({}));


      console.log(
        "School Admin Login Response:",
        data
      );


      if (
        !response.ok ||
        !data.success
      ) {

        throw new Error(
          data.message ||
          "Email au password si sahihi."
        );

      }


      /*
       * Server inaweza kutumia jina token
       * au access_token.
       */

      const token =
        data.token ||
        data.access_token ||
        data.accessToken ||
        "";


      if (!token) {

        throw new Error(
          "Login imekubaliwa lakini server haijarudisha token ya School Admin."
        );

      }


      /*
       * HIFADHI TOKEN.
       */

      saveSchoolAdminToken(token);


      /*
       * Thibitisha token kabla ya kupeleka
       * dashboard.
       */

      const verifyResponse = await fetch(
        `${API_BASE}/api/school-admin/me`,
        {

          method: "GET",

          headers: {
            "Accept": "application/json",
            "Authorization": `Bearer ${token}`
          },

          credentials: "include",

          cache: "no-store"

        }
      );


      const verifyData =
        await verifyResponse.json().catch(() => ({}));


      console.log(
        "School Admin Session Verification:",
        verifyData
      );


      if (
        !verifyResponse.ok ||
        !verifyData.success
      ) {

        clearSchoolAdminToken();

        throw new Error(
          verifyData.message ||
          "Login imefanikiwa lakini session haijathibitishwa."
        );

      }


      showMessage(
        "✓ Umeingia kikamilifu. Inafungua dashboard...",
        "success"
      );


      loginButton.textContent =
        "✓ Umeingia";


      loading.textContent =
        "Inafungua dashboard...";


      /*
       * Token sasa ipo localStorage.
       * Dashboard itaipata baada ya redirect.
       */

      setTimeout(() => {

        window.location.replace(
          "/school-admin-dashboard.html"
        );

      }, 400);


    } catch (error) {

      console.error(
        "School Admin Login Error:",
        error
      );


      showMessage(
        error.message ||
        "Imeshindikana kuingia kwenye mfumo."
      );


      loginButton.disabled = false;

      loginButton.textContent = "Ingia";

      loading.style.display = "none";

    }

  }
);


/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    /*
     * Kama admin tayari ana session,
     * asiombwe ku-login tena.
     */

    await checkExistingSession();

  }
);

</script>

</body>
</html>
