<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>School Admin Login - Shule Portal Tanzania</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
    }

    .login-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-icon {
      font-size: 55px;
      margin-bottom: 8px;
    }

    .logo h1 {
      margin: 0;
      color: #1565c0;
      font-size: 25px;
    }

    .logo p {
      margin: 7px 0 0;
      color: #666;
      font-size: 14px;
    }

    .title {
      text-align: center;
      margin-bottom: 25px;
    }

    .title h2 {
      margin: 0;
      color: #222;
      font-size: 22px;
    }

    .title p {
      margin: 8px 0 0;
      color: #777;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #1565c0;
      box-shadow: 0 0 0 3px rgba(21,101,192,0.1);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 55px;
    }

    .show-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 20px;
      padding: 5px;
    }

    .login-button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      background: #1565c0;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 5px;
    }

    .login-button:hover {
      background: #0d47a1;
    }

    .login-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
    }

    .message.success {
      display: block;
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
    }

    .back-link {
      text-align: center;
      margin-top: 22px;
    }

    .back-link a {
      color: #1565c0;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

    .security-note {
      margin-top: 22px;
      background: #f5f7fa;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      font-size: 12px;
      color: #777;
      line-height: 1.5;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 10px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="login-card">

      <div class="logo">
        <div class="logo-icon">🏫</div>
        <h1>Shule Portal Tanzania</h1>
        <p>School Administration System</p>
      </div>

      <div class="title">
        <h2>🔐 School Admin Login</h2>
        <p>Ingia kusimamia shule yako</p>
      </div>

      <div id="message" class="message"></div>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">Barua pepe</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="mfano@gmail.com"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">

          <label for="password">Password</label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Ingiza password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="show-password"
              id="togglePassword"
              aria-label="Onyesha password"
            >
              👁️
            </button>

          </div>

        </div>

        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >
          Ingia
        </button>

        <div class="loading" id="loading">
          Inaingia kwenye mfumo...
        </div>

      </form>

      <div class="back-link">
        <a href="/">← Rudi kwenye ukurasa mkuu</a>
      </div>

      <div class="security-note">
        🔒 Mfumo huu ni kwa School Admin pekee.
        Usishirikishe password yako na mtu mwingine.
      </div>

    </div>

  </div>

<script>

const loginForm = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const loading = document.getElementById("loading");
const message = document.getElementById("message");
const togglePassword = document.getElementById("togglePassword");


function showMessage(text, type = "error") {

  message.textContent = text;

  message.className = "message " + type;
}


function hideMessage() {

  message.textContent = "";
  message.className = "message";
}


// Show / hide password
togglePassword.addEventListener("click", () => {

  if (passwordInput.type === "password") {

    passwordInput.type = "text";
    togglePassword.textContent = "🙈";

  } else {

    passwordInput.type = "password";
    togglePassword.textContent = "👁️";

  }

});


// Prevent automatic login.
// Login must ALWAYS be performed through the form.
loginForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  hideMessage();

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {

    showMessage("Tafadhali jaza email na password.");

    return;
  }


  loginButton.disabled = true;
  loginButton.textContent = "Inaingia...";
  loading.style.display = "block";


  try {

    const response = await fetch("/api/school-admin/login", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      credentials: "include",

      body: JSON.stringify({
        email: email,
        password: password
      })

    });


    const data = await response.json();


    if (!response.ok || !data.success) {

      throw new Error(
        data.message || "Email au password si sahihi."
      );

    }


    showMessage(
      "Umeingia kikamilifu. Inafungua dashboard...",
      "success"
    );


    /*
      Muhimu:
      Hapa ndipo tunampeleka admin dashboard.
      Hatupeleki dashboard kabla ya server kuthibitisha login.
    */

    setTimeout(() => {

      window.location.replace(
        "/school-admin-dashboard.html"
      );

    }, 500);


  } catch (error) {

    console.error("Login error:", error);

    showMessage(
      error.message ||
      "Imeshindikana kuingia kwenye mfumo."
    );

    loginButton.disabled = false;
    loginButton.textContent = "Ingia";
    loading.style.display = "none";

  }

});

</script>

</body>
</html>
