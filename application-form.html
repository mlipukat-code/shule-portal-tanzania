<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fomu ya Maombi - Shule Portal Tanzania</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8fb;
      color: #222;
    }

    header {
      background: #0b74b8;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      width: 94%;
      max-width: 850px;
      margin: 25px auto;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      color: #0b74b8;
      margin-top: 0;
    }

    .school-info {
      background: #eef7fd;
      border-left: 5px solid #0b74b8;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .school-info p {
      margin: 7px 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 14px;
      margin-top: 22px;
      background: #0b74b8;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      margin-top: 15px;
      border-radius: 7px;
      text-align: left;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .error {
      background: #ffe5e5;
      color: #a00000;
      border: 1px solid #ffb3b3;
    }

    .loading-school {
      text-align: center;
      padding: 15px;
      color: #0b74b8;
      font-weight: bold;
    }

    .required {
      color: red;
    }

    .section-title {
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .container {
        width: 96%;
      }

      .card {
        padding: 16px;
      }

      header h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📝 Fomu ya Maombi ya Shule</h1>
</header>

<div class="container">

  <div class="card">

    <!-- SCHOOL LOADING -->

    <div
      id="schoolLoading"
      class="loading-school"
    >
      Inapakia taarifa za shule...
    </div>


    <!-- SCHOOL INFORMATION -->

    <div
      id="schoolInfo"
      class="school-info"
      style="display:none;"
    >

      <h2 id="schoolName">-</h2>

      <p>
        <strong>Mkoa:</strong>
        <span id="schoolRegion">-</span>
      </p>

      <p>
        <strong>Wilaya:</strong>
        <span id="schoolDistrict">-</span>
      </p>

      <p>
        <strong>Aina ya Shule:</strong>
        <span id="schoolType">-</span>
      </p>

      <p>
        <strong>Gharama ya Fomu:</strong>
        TSh <span id="formPrice">-</span>
      </p>

    </div>


    <!-- APPLICATION FORM -->

    <h2>Taarifa za Mwanafunzi</h2>

    <form id="applicationForm">

      <!-- STUDENT NAME -->

      <label>
        Jina Kamili la Mwanafunzi
        <span class="required">*</span>
      </label>

      <input
        type="text"
        id="studentName"
        placeholder="Mfano: John Mlipuka"
        required
      >


      <!-- GENDER -->

      <label>
        Jinsia
        <span class="required">*</span>
      </label>

      <select
        id="gender"
        required
      >

        <option value="">
          -- Chagua Jinsia --
        </option>

        <option value="Male">
          Mwanaume
        </option>

        <option value="Female">
          Mwanamke
        </option>

      </select>


      <!-- DATE OF BIRTH -->

      <label>
        Tarehe ya Kuzaliwa
        <span class="required">*</span>
      </label>

      <input
        type="date"
        id="dateOfBirth"
        required
      >


      <!-- CLASS -->

      <label>
        Darasa / Kidato
        <span class="required">*</span>
      </label>

      <select
        id="classLevel"
        required
      >

        <option value="">
          -- Chagua Darasa / Kidato --
        </option>

        <optgroup label="Shule ya Msingi">

          <option value="Darasa la 1">
            Darasa la 1
          </option>

          <option value="Darasa la 2">
            Darasa la 2
          </option>

          <option value="Darasa la 3">
            Darasa la 3
          </option>

          <option value="Darasa la 4">
            Darasa la 4
          </option>

          <option value="Darasa la 5">
            Darasa la 5
          </option>

          <option value="Darasa la 6">
            Darasa la 6
          </option>

          <option value="Darasa la 7">
            Darasa la 7
          </option>

        </optgroup>


        <optgroup label="Sekondari">

          <option value="Kidato cha 1">
            Kidato cha 1
          </option>

          <option value="Kidato cha 2">
            Kidato cha 2
          </option>

          <option value="Kidato cha 3">
            Kidato cha 3
          </option>

          <option value="Kidato cha 4">
            Kidato cha 4
          </option>

          <option value="Kidato cha 5">
            Kidato cha 5
          </option>

          <option value="Kidato cha 6">
            Kidato cha 6
          </option>

        </optgroup>

      </select>


      <!-- PARENT -->

      <h2 class="section-title">
        Taarifa za Mzazi / Mlezi
      </h2>


      <label>
        Jina la Mzazi / Mlezi
        <span class="required">*</span>
      </label>

      <input
        type="text"
        id="parentName"
        placeholder="Jina kamili la mzazi/mlezi"
        required
      >


      <!-- PHONE -->

      <label>
        Namba ya Simu
        <span class="required">*</span>
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="Mfano: 0765447073"
        required
      >


      <!-- EMAIL -->

      <label>
        Barua Pepe
      </label>

      <input
        type="email"
        id="email"
        placeholder="example@gmail.com"
      >


      <!-- ADDRESS -->

      <label>
        Anwani ya Makazi
      </label>

      <textarea
        id="address"
        placeholder="Andika anwani ya makazi..."
      ></textarea>


      <!-- MESSAGE -->

      <div
        id="message"
        class="message"
      ></div>


      <!-- SUBMIT -->

      <button
        type="submit"
        id="submitButton"
        disabled
      >
        Endelea na Malipo 💳
      </button>

    </form>

  </div>

</div>


<script>

  // ==========================================
  // URL PARAMETERS
  // ==========================================

  const params =
    new URLSearchParams(
      window.location.search
    );

  const schoolId =
    params.get("school_id");


  // ==========================================
  // ELEMENTS
  // ==========================================

  const schoolLoading =
    document.getElementById(
      "schoolLoading"
    );

  const schoolInfo =
    document.getElementById(
      "schoolInfo"
    );

  const schoolName =
    document.getElementById(
      "schoolName"
    );

  const schoolRegion =
    document.getElementById(
      "schoolRegion"
    );

  const schoolDistrict =
    document.getElementById(
      "schoolDistrict"
    );

  const schoolType =
    document.getElementById(
      "schoolType"
    );

  const formPrice =
    document.getElementById(
      "formPrice"
    );

  const message =
    document.getElementById(
      "message"
    );

  const submitButton =
    document.getElementById(
      "submitButton"
    );


  // ==========================================
  // MESSAGE
  // ==========================================

  function showMessage(
    text
  ) {

    message.textContent =
      text;

    message.className =
      "message error";

    message.style.display =
      "block";

  }


  // ==========================================
  // LOAD SCHOOL
  // ==========================================

  async function loadSchool() {

    if (!schoolId) {

      schoolLoading.textContent =
        "⚠️ Hakuna shule iliyochaguliwa.";

      showMessage(
        "Tafadhali rudi kwenye Tafuta Shule na uchague shule."
      );

      return;

    }


    try {

      const response =
        await fetch(
          `${window.location.origin}/api/schools`,
          {
            method: "GET",
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "Server imeshindwa kutoa taarifa za shule. HTTP " +
          response.status
        );

      }


      const data =
        await response.json();


      if (
        !data.success ||
        !Array.isArray(data.schools)
      ) {

        throw new Error(
          "Taarifa za shule hazijapatikana kutoka server."
        );

      }


      const school =
        data.schools.find(
          item =>
            String(item.id) ===
            String(schoolId)
        );


      if (!school) {

        schoolLoading.textContent =
          "⚠️ Shule haikupatikana.";

        showMessage(
          "Shule yenye ID " +
          schoolId +
          " haikupatikana."
        );

        return;

      }


      // ======================================
      // DISPLAY SCHOOL
      // ======================================

      schoolName.textContent =
        school.name || "-";

      schoolRegion.textContent =
        school.region || "-";

      schoolDistrict.textContent =
        school.district || "-";

      schoolType.textContent =
        school.school_type ||
        school.type ||
        "-";

      formPrice.textContent =
        Number(
          school.form_price ||
          school.price ||
          0
        ).toLocaleString();


      schoolLoading.style.display =
        "none";

      schoolInfo.style.display =
        "block";

      submitButton.disabled =
        false;


      // ======================================
      // PREFILL BASIC DETAILS
      // ======================================

      document.getElementById(
        "studentName"
      ).value =
        params.get("student_name") || "";

      document.getElementById(
        "phone"
      ).value =
        params.get("phone") || "";

      document.getElementById(
        "email"
      ).value =
        params.get("email") || "";


      // Muhimu:
      // class_level HAITOKI URL.
      // Mtumiaji atachagua mwenyewe.


    } catch (error) {

      console.error(
        "Load school error:",
        error
      );

      schoolLoading.textContent =
        "⚠️ Imeshindikana kupakia taarifa za shule.";

      showMessage(
        "Kosa: " +
        error.message
      );

    }

  }


  // ==========================================
  // SUBMIT APPLICATION
  // ==========================================

  document
    .getElementById(
      "applicationForm"
    )
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        // --------------------------------------
        // DISABLE BUTTON
        // --------------------------------------

        submitButton.disabled =
          true;

        submitButton.textContent =
          "Inahifadhi maombi...";

        message.style.display =
          "none";


        // --------------------------------------
        // DATA
        // --------------------------------------

        const applicationData = {

          school_id:
            Number(schoolId),

          student_name:
            document
              .getElementById(
                "studentName"
              )
              .value
              .trim(),

          gender:
            document
              .getElementById(
                "gender"
              )
              .value,

          date_of_birth:
            document
              .getElementById(
                "dateOfBirth"
              )
              .value,

          class_level:
            document
              .getElementById(
                "classLevel"
              )
              .value,

          parent_name:
            document
              .getElementById(
                "parentName"
              )
              .value
              .trim(),

          phone:
            document
              .getElementById(
                "phone"
              )
              .value
              .trim(),

          email:
            document
              .getElementById(
                "email"
              )
              .value
              .trim(),

          address:
            document
              .getElementById(
                "address"
              )
              .value
              .trim()

        };


        // --------------------------------------
        // SEND APPLICATION
        // --------------------------------------

        try {

          const response =
            await fetch(
              `${window.location.origin}/api/applications`,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify(
                    applicationData
                  )
              }
            );


          const result =
            await response.json();


          // ------------------------------------
          // ERROR FROM SERVER
          // ------------------------------------

          if (
            !response.ok ||
            !result.success
          ) {

            throw new Error(
              result.error ||
              result.message ||
              "Imeshindikana kuhifadhi maombi."
            );

          }


          // ------------------------------------
          // SAVE REFERENCES
          // ------------------------------------

          sessionStorage.setItem(
            "application_id",
            result.application.id
          );

          sessionStorage.setItem(
            "application_number",
            result.application.application_number
          );

          sessionStorage.setItem(
            "payment_id",
            result.payment.id
          );

          sessionStorage.setItem(
            "payment_reference",
            result.payment.payment_reference
          );


          // ------------------------------------
          // GO TO PAYMENT
          // ------------------------------------

          const nextUrl =
            "/payment.html" +
            "?school_id=" +
            encodeURIComponent(
              schoolId
            ) +

            "&application_id=" +
            encodeURIComponent(
              result.application.id
            ) +

            "&application_number=" +
            encodeURIComponent(
              result.application.application_number
            ) +

            "&payment_id=" +
            encodeURIComponent(
              result.payment.id
            ) +

            "&payment_reference=" +
            encodeURIComponent(
              result.payment.payment_reference
            );


          window.location.href =
            nextUrl;


        } catch (error) {

          console.error(
            "Application submit error:",
            error
          );


          showMessage(
            "Imeshindikana kuhifadhi maombi.\n\n" +
            error.message
          );


          submitButton.disabled =
            false;

          submitButton.textContent =
            "Endelea na Malipo 💳";

        }

      }
    );


  // ==========================================
  // START
  // ==========================================

  loadSchool();

</script>

</body>
</html>
