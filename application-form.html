<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fomu ya Maombi - Shule Portal Tanzania</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #0b5ed7;
      color: white;
      text-align: center;
      padding: 22px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 7px 0 0;
      font-size: 14px;
    }

    .container {
      width: 94%;
      max-width: 750px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .school-name {
      text-align: center;
      color: #0b5ed7;
      font-size: 27px;
      margin: 0 0 8px;
    }

    .school-subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .school-info {
      background: #f7f9fc;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 25px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 9px 0;
      border-bottom: 1px solid #ddd;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .label {
      color: #666;
    }

    .value {
      font-weight: bold;
      text-align: right;
    }

    .price {
      color: #198754;
      font-size: 20px;
    }

    h2 {
      color: #0b5ed7;
      font-size: 20px;
      margin-top: 0;
    }

    h3 {
      color: #0b5ed7;
      font-size: 18px;
      margin-top: 28px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #0b5ed7;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      margin-top: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary {
      background: #198754;
      color: white;
    }

    .btn-primary:hover {
      background: #146c43;
    }

    .btn-back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #0b5ed7;
      text-decoration: none;
      font-weight: bold;
    }

    .notice {
      background: #e7f5ff;
      color: #084298;
      padding: 15px;
      border-radius: 10px;
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #555;
    }

    .error {
      background: #f8d7da;
      color: #842029;
      padding: 18px;
      border-radius: 10px;
      text-align: center;
    }

    .required {
      color: #dc3545;
    }

    @media (max-width: 600px) {

      .card {
        padding: 18px;
      }

      .school-name {
        font-size: 22px;
      }

      .info-row {
        flex-direction: column;
        gap: 4px;
      }

      .value {
        text-align: left;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🏫 Shule Portal Tanzania</h1>
  <p>Fomu ya Maombi ya Kujiunga na Shule</p>
</header>

<div class="container">

  <div id="content">

    <div class="loading">
      Inapakia fomu...
    </div>

  </div>

</div>

<script>

  const API_URL = "/api/schools";

  let selectedSchool = null;


  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function formatMoney(amount) {

    if (
      amount === null ||
      amount === undefined ||
      amount === ""
    ) {
      return "Haijawekwa";
    }

    const number = Number(amount);

    if (isNaN(number)) {
      return amount;
    }

    return "TSh " + number.toLocaleString("en-TZ");
  }


  function formatDate(dateString) {

    if (!dateString) {
      return "Haijawekwa";
    }

    const date = new Date(dateString);

    if (isNaN(date.getTime())) {
      return dateString;
    }

    return date.toLocaleDateString("sw-TZ", {
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    });
  }


  async function loadApplicationForm() {

    const content =
      document.getElementById("content");


    try {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const schoolId =
        params.get("school_id");


      if (!schoolId) {

        content.innerHTML = `
          <div class="card">

            <div class="error">

              <h3>Shule haijachaguliwa</h3>

              <p>
                Tafadhali rudi na uchague shule
                kabla ya kuanza maombi.
              </p>

            </div>

            <a
              class="btn-back"
              href="/schools-public.html"
            >
              ← Rudi Kutafuta Shule
            </a>

          </div>
        `;

        return;
      }


      const response =
        await fetch(API_URL);


      if (!response.ok) {
        throw new Error(
          "Imeshindikana kupata shule."
        );
      }


      const data =
        await response.json();


      if (
        !data.success ||
        !Array.isArray(data.schools)
      ) {
        throw new Error(
          "Taarifa za shule hazijapatikana."
        );
      }


      selectedSchool =
        data.schools.find(
          school =>
            String(school.id) ===
            String(schoolId)
        );


      if (!selectedSchool) {

        content.innerHTML = `
          <div class="card">

            <div class="error">

              <h3>Shule haijapatikana</h3>

              <p>
                Shule uliyochagua haipo
                kwenye mfumo.
              </p>

            </div>

            <a
              class="btn-back"
              href="/schools-public.html"
            >
              ← Rudi Kutafuta Shule
            </a>

          </div>
        `;

        return;
      }


      const price =
        selectedSchool.form_price ||
        selectedSchool.price;


      /*
       * Pokea taarifa zilizotumwa kutoka
       * buy-form.html
       */
      const previousStudentName =
        params.get("student_name") || "";

      const previousPhone =
        params.get("phone") || "";

      const previousEmail =
        params.get("email") || "";

      const previousClass =
        params.get("class_level") || "";


      content.innerHTML = `

        <div class="card">

          <h1 class="school-name">
            ${escapeHtml(selectedSchool.name)}
          </h1>

          <div class="school-subtitle">
            Fomu ya Maombi ya Kujiunga
          </div>


          <div class="school-info">

            <div class="info-row">

              <span class="label">
                🏫 Shule
              </span>

              <span class="value">
                ${escapeHtml(selectedSchool.name)}
              </span>

            </div>


            <div class="info-row">

              <span class="label">
                📍 Mkoa
              </span>

              <span class="value">
                ${escapeHtml(
                  selectedSchool.region ||
                  "Haijawekwa"
                )}
              </span>

            </div>


            <div class="info-row">

              <span class="label">
                📍 Wilaya
              </span>

              <span class="value">
                ${escapeHtml(
                  selectedSchool.district ||
                  "Haijawekwa"
                )}
              </span>

            </div>


            <div class="info-row">

              <span class="label">
                🏫 Aina ya Shule
              </span>

              <span class="value">
                ${escapeHtml(
                  selectedSchool.school_type ||
                  selectedSchool.type ||
                  "Haijawekwa"
                )}
              </span>

            </div>


            <div class="info-row">

              <span class="label">
                💰 Bei ya Fomu
              </span>

              <span class="value price">
                ${formatMoney(price)}
              </span>

            </div>


            <div class="info-row">

              <span class="label">
                📅 Maombi yanaanza
              </span>

              <span class="value">
                ${formatDate(
                  selectedSchool.application_start
                )}
              </span>

            </div>


            <div class="info-row">

              <span class="label">
                📅 Maombi yanafunga
              </span>

              <span class="value">
                ${formatDate(
                  selectedSchool.application_end
                )}
              </span>

            </div>

          </div>


          <div class="notice">

            <strong>Umechagua:</strong>
            ${escapeHtml(selectedSchool.name)}
            <br><br>

            Tafadhali jaza taarifa za mwanafunzi
            kwa usahihi. Taarifa hizi zitatumika
            katika mchakato wa maombi ya kujiunga.

          </div>


          <h2>
            👨‍🎓 Taarifa za Mwanafunzi
          </h2>


          <form
            id="applicationForm"
            onsubmit="submitApplication(event)"
          >

            <label for="studentName">
              Jina kamili la mwanafunzi
              <span class="required">*</span>
            </label>

            <input
              type="text"
              id="studentName"
              value="${escapeHtml(previousStudentName)}"
              placeholder="Mfano: Juma Hassan Mussa"
              required
            >


            <label for="gender">
              Jinsia
              <span class="required">*</span>
            </label>

            <select id="gender" required>

              <option value="">
                Chagua jinsia
              </option>

              <option value="Mwanaume">
                Mwanaume
              </option>

              <option value="Mwanamke">
                Mwanamke
              </option>

            </select>


            <label for="dateOfBirth">
              Tarehe ya kuzaliwa
              <span class="required">*</span>
            </label>

            <input
              type="date"
              id="dateOfBirth"
              required
            >


            <label for="classLevel">
              Darasa/Kidato anachoomba
              <span class="required">*</span>
            </label>

            <select id="classLevel" required>

              <option value="">
                Chagua darasa/kidato
              </option>

              <option value="Awali">
                Awali
              </option>

              <option value="Darasa la 1">
                Darasa la 1
              </option>

              <option value="Darasa la 2">
                Darasa la 2
              </option>

              <option value="Darasa la 3">
                Darasa la 3
              </option>

              <option value="Darasa la 4">
                Darasa la 4
              </option>

              <option value="Darasa la 5">
                Darasa la 5
              </option>

              <option value="Darasa la 6">
                Darasa la 6
              </option>

              <option value="Darasa la 7">
                Darasa la 7
              </option>

              <option value="Kidato cha 1">
                Kidato cha 1
              </option>

              <option value="Kidato cha 2">
                Kidato cha 2
              </option>

              <option value="Kidato cha 3">
                Kidato cha 3
              </option>

              <option value="Kidato cha 4">
                Kidato cha 4
              </option>

              <option value="Kidato cha 5">
                Kidato cha 5
              </option>

              <option value="Kidato cha 6">
                Kidato cha 6
              </option>

            </select>


            <h3>
              👨‍👩‍👧 Taarifa za Mzazi/Mlezi
            </h3>


            <label for="parentName">
              Jina la mzazi/mlezi
              <span class="required">*</span>
            </label>

            <input
              type="text"
              id="parentName"
              placeholder="Jina kamili la mzazi/mlezi"
              required
            >


            <label for="phone">
              Namba ya simu
              <span class="required">*</span>
            </label>

            <input
              type="tel"
              id="phone"
              value="${escapeHtml(previousPhone)}"
              placeholder="Mfano: 0712345678"
              required
            >


            <label for="email">
              Barua pepe
            </label>

            <input
              type="email"
              id="email"
              value="${escapeHtml(previousEmail)}"
              placeholder="Mfano: mzazi@email.com"
            >


            <label for="address">
              Anwani ya mzazi/mlezi
              <span class="required">*</span>
            </label>

            <textarea
              id="address"
              placeholder="Andika anwani ya makazi"
              required
            ></textarea>


            <button
              type="submit"
              class="btn btn-primary"
            >
              ➜ Endelea
            </button>

          </form>


          <a
            class="btn-back"
            href="/buy-form.html?school_id=${encodeURIComponent(selectedSchool.id)}"
          >
            ← Rudi kwenye taarifa za fomu
          </a>

        </div>

      `;


      /*
       * Kama darasa lilitumwa kutoka
       * buy-form.html, lichague lenyewe.
       */
      if (previousClass) {

        const classSelect =
          document.getElementById("classLevel");

        const exists =
          Array.from(
            classSelect.options
          ).some(
            option =>
              option.value === previousClass
          );

        if (exists) {
          classSelect.value = previousClass;
        }

      }


    } catch (error) {

      console.error(error);

      content.innerHTML = `
        <div class="card">

          <div class="error">

            <h3>Hitilafu imetokea</h3>

            <p>
              Imeshindikana kufungua
              fomu ya maombi.
            </p>

          </div>

          <a
            class="btn-back"
            href="/schools-public.html"
          >
            ← Rudi Kutafuta Shule
          </a>

        </div>
      `;

    }

  }


  function submitApplication(event) {

    event.preventDefault();


    if (!selectedSchool) {

      alert(
        "Taarifa za shule hazijapatikana."
      );

      return;
    }


    const studentName =
      document.getElementById(
        "studentName"
      ).value.trim();


    const gender =
      document.getElementById(
        "gender"
      ).value;


    const dateOfBirth =
      document.getElementById(
        "dateOfBirth"
      ).value;


    const classLevel =
      document.getElementById(
        "classLevel"
      ).value;


    const parentName =
      document.getElementById(
        "parentName"
      ).value.trim();


    const phone =
      document.getElementById(
        "phone"
      ).value.trim();


    const email =
      document.getElementById(
        "email"
      ).value.trim();


    const address =
      document.getElementById(
        "address"
      ).value.trim();


    const params =
      new URLSearchParams();


    /*
     * SHULE ILIYOTEULIWA
     */
    params.set(
      "school_id",
      selectedSchool.id
    );


    params.set(
      "student_name",
      studentName
    );


    params.set(
      "gender",
      gender
    );


    params.set(
      "date_of_birth",
      dateOfBirth
    );


    params.set(
      "class_level",
      classLevel
    );


    params.set(
      "parent_name",
      parentName
    );


    params.set(
      "phone",
      phone
    );


    params.set(
      "email",
      email
    );


    params.set(
      "address",
      address
    );


    /*
     * Kwa sasa tunaenda kwenye
     * payment.html huku tukibeba
     * taarifa zote.
     */
    window.location.href =
      "/payment.html?" +
      params.toString();

  }


  loadApplicationForm();

</script>

</body>
</html>
