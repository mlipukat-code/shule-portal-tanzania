<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fomu ya Maombi - Shule Portal Tanzania</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8fb;
      color: #222;
    }

    header {
      background: #0b74b8;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      width: 94%;
      max-width: 850px;
      margin: 25px auto;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      color: #0b74b8;
      margin-top: 0;
    }

    .school-info {
      background: #eef7fd;
      border-left: 5px solid #0b74b8;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .school-info p {
      margin: 7px 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 14px;
      margin-top: 22px;
      background: #0b74b8;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      margin-top: 15px;
      border-radius: 7px;
      text-align: center;
    }

    .error {
      background: #ffe5e5;
      color: #a00000;
    }

    .loading {
      background: #fff4d6;
      color: #7a5600;
    }

    .required {
      color: red;
    }

    @media (max-width: 600px) {
      .container {
        width: 96%;
      }

      .card {
        padding: 16px;
      }

      header h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📝 Fomu ya Maombi ya Shule</h1>
</header>

<div class="container">

  <div class="card">

    <div class="school-info">
      <h2 id="schoolName">Inapakia shule...</h2>

      <p>
        <strong>Mkoa:</strong>
        <span id="schoolRegion">-</span>
      </p>

      <p>
        <strong>Wilaya:</strong>
        <span id="schoolDistrict">-</span>
      </p>

      <p>
        <strong>Aina ya Shule:</strong>
        <span id="schoolType">-</span>
      </p>

      <p>
        <strong>Gharama ya Fomu:</strong>
        TSh <span id="formPrice">-</span>
      </p>
    </div>

    <h2>Taarifa za Mwanafunzi</h2>

    <form id="applicationForm">

      <label>
        Jina Kamili la Mwanafunzi
        <span class="required">*</span>
      </label>

      <input
        type="text"
        id="studentName"
        required
      >


      <label>
        Jinsia
        <span class="required">*</span>
      </label>

      <select id="gender" required>
        <option value="">-- Chagua Jinsia --</option>
        <option value="Male">Mwanaume</option>
        <option value="Female">Mwanamke</option>
      </select>


      <label>
        Tarehe ya Kuzaliwa
        <span class="required">*</span>
      </label>

      <input
        type="date"
        id="dateOfBirth"
        required
      >


      <label>
        Darasa / Kidato
        <span class="required">*</span>
      </label>

      <input
        type="text"
        id="classLevel"
        placeholder="Mfano: Darasa la 1 / Kidato cha 1"
        required
      >


      <h2 style="margin-top:30px;">
        Taarifa za Mzazi / Mlezi
      </h2>


      <label>
        Jina la Mzazi / Mlezi
        <span class="required">*</span>
      </label>

      <input
        type="text"
        id="parentName"
        required
      >


      <label>
        Namba ya Simu
        <span class="required">*</span>
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="Mfano: 0765447073"
        required
      >


      <label>
        Barua Pepe
      </label>

      <input
        type="email"
        id="email"
        placeholder="example@gmail.com"
      >


      <label>
        Anwani ya Makazi
      </label>

      <textarea
        id="address"
        placeholder="Andika anwani ya makazi..."
      ></textarea>


      <div
        id="message"
        class="message"
      ></div>


      <button
        type="submit"
        id="submitButton"
      >
        Endelea na Malipo 💳
      </button>

    </form>

  </div>

</div>


<script>

  // ==========================================
  // GET SCHOOL ID
  // ==========================================

  const params =
    new URLSearchParams(
      window.location.search
    );

  const schoolId =
    params.get("school_id");


  // ==========================================
  // ELEMENTS
  // ==========================================

  const schoolName =
    document.getElementById("schoolName");

  const schoolRegion =
    document.getElementById("schoolRegion");

  const schoolDistrict =
    document.getElementById("schoolDistrict");

  const schoolType =
    document.getElementById("schoolType");

  const formPrice =
    document.getElementById("formPrice");

  const message =
    document.getElementById("message");

  const submitButton =
    document.getElementById("submitButton");


  // ==========================================
  // SHOW MESSAGE
  // ==========================================

  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display = "block";

  }


  // ==========================================
  // LOAD SCHOOL
  // ==========================================

  async function loadSchool() {

    if (!schoolId) {

      schoolName.textContent =
        "Shule haijachaguliwa.";

      submitButton.disabled = true;

      return;

    }


    try {

      const response =
        await fetch("/api/schools");

      const data =
        await response.json();


      if (
        !data.success ||
        !data.schools
      ) {

        throw new Error(
          "Imeshindikana kupata shule."
        );

      }


      const school =
        data.schools.find(
          item =>
            String(item.id) ===
            String(schoolId)
        );


      if (!school) {

        schoolName.textContent =
          "Shule haikupatikana.";

        submitButton.disabled = true;

        return;

      }


      schoolName.textContent =
        school.name;

      schoolRegion.textContent =
        school.region || "-";

      schoolDistrict.textContent =
        school.district || "-";

      schoolType.textContent =
        school.school_type || "-";

      formPrice.textContent =
        Number(
          school.form_price
        ).toLocaleString();


      // --------------------------------------
      // PREFILL DATA FROM PREVIOUS PAGE
      // --------------------------------------

      document.getElementById(
        "studentName"
      ).value =
        params.get("student_name") || "";

      document.getElementById(
        "phone"
      ).value =
        params.get("phone") || "";

      document.getElementById(
        "email"
      ).value =
        params.get("email") || "";

      document.getElementById(
        "classLevel"
      ).value =
        params.get("class_level") || "";


    } catch (error) {

      console.error(error);

      schoolName.textContent =
        "Kuna tatizo la kupakia taarifa za shule.";

      submitButton.disabled = true;

    }

  }


  // ==========================================
  // SUBMIT APPLICATION
  // ==========================================

  document
    .getElementById("applicationForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        submitButton.disabled = true;

        submitButton.textContent =
          "Inahifadhi maombi...";


        message.style.display = "none";


        const applicationData = {

          school_id: Number(schoolId),

          student_name:
            document.getElementById(
              "studentName"
            ).value.trim(),

          gender:
            document.getElementById(
              "gender"
            ).value,

          date_of_birth:
            document.getElementById(
              "dateOfBirth"
            ).value,

          class_level:
            document.getElementById(
              "classLevel"
            ).value.trim(),

          parent_name:
            document.getElementById(
              "parentName"
            ).value.trim(),

          phone:
            document.getElementById(
              "phone"
            ).value.trim(),

          email:
            document.getElementById(
              "email"
            ).value.trim(),

          address:
            document.getElementById(
              "address"
            ).value.trim()

        };


        try {

          const response =
            await fetch(
              "/api/applications",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify(
                    applicationData
                  )
              }
            );


          const result =
            await response.json();


          if (!response.ok ||
              !result.success) {

            throw new Error(
              result.message ||
              "Imeshindikana kuhifadhi maombi."
            );

          }


          // ==================================
          // SAVE APPLICATION DATA LOCALLY
          // ==================================

          sessionStorage.setItem(
            "application_id",
            result.application.id
          );

          sessionStorage.setItem(
            "application_number",
            result.application.application_number
          );

          sessionStorage.setItem(
            "payment_id",
            result.payment.id
          );

          sessionStorage.setItem(
            "payment_reference",
            result.payment.payment_reference
          );


          // ==================================
          // GO TO PAYMENT
          // ==================================

          const nextUrl =
            "/payment.html" +
            "?school_id=" +
            encodeURIComponent(
              schoolId
            ) +

            "&application_id=" +
            encodeURIComponent(
              result.application.id
            ) +

            "&application_number=" +
            encodeURIComponent(
              result.application.application_number
            ) +

            "&payment_id=" +
            encodeURIComponent(
              result.payment.id
            ) +

            "&payment_reference=" +
            encodeURIComponent(
              result.payment.payment_reference
            );


          window.location.href =
            nextUrl;


        } catch (error) {

          console.error(error);

          showMessage(
            error.message ||
            "Kuna tatizo. Tafadhali jaribu tena.",
            "error"
          );

          submitButton.disabled = false;

          submitButton.textContent =
            "Endelea na Malipo 💳";

        }

      }
    );


  //
