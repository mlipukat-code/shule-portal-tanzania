<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shule Portal Tanzania - Shule</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f8fb;
      color: #222;
    }

    header {
      background: #0879c9;
      color: white;
      padding: 18px;
    }

    header h1 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      width: 95%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      color: #0879c9;
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
      width: 100%;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      background: #0879c9;
      color: white;
      border: none;
      padding: 13px 22px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      margin-top: 18px;
    }

    button:hover {
      background: #0565a8;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      display: none;
    }

    .success {
      background: #dff5e5;
      color: #176b2c;
    }

    .error {
      background: #fde1e1;
      color: #a40000;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #0879c9;
      color: white;
    }

    tr:hover {
      background: #f5faff;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #0879c9;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .card {
        padding: 16px;
      }

      header h1 {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Shule Portal Tanzania</h1>
  <p>Usimamizi wa Shule</p>
</header>

<div class="container">

  <!-- ADD SCHOOL -->
  <div class="card">

    <h2>Ongeza Shule</h2>

    <form id="schoolForm">

      <div class="form-grid">

        <div class="field">
          <label>Jina la Shule *</label>
          <input
            type="text"
            id="name"
            required
            placeholder="Mfano: Mlipuka Academy">
        </div>

        <div class="field">
          <label>Mkoa *</label>
          <input
            type="text"
            id="region"
            required
            placeholder="Mfano: Dar es Salaam">
        </div>

        <div class="field">
          <label>Wilaya *</label>
          <input
            type="text"
            id="district"
            required
            placeholder="Mfano: Kinondoni">
        </div>

        <div class="field">
          <label>Aina ya Shule *</label>
          <select id="school_type" required>
            <option value="">Chagua aina</option>
            <option value="Primary">Primary</option>
            <option value="Secondary">Secondary</option>
            <option value="Primary & Secondary">Primary & Secondary</option>
          </select>
        </div>

        <div class="field">
          <label>Bei ya Fomu (TZS) *</label>
          <input
            type="number"
            id="form_price"
            required
            min="0"
            placeholder="10000">
        </div>

        <div class="field">
          <label>Namba ya Simu</label>
          <input
            type="text"
            id="phone"
            placeholder="0712345678">
        </div>

        <div class="field">
          <label>Email</label>
          <input
            type="email"
            id="email"
            placeholder="info@shule.co.tz">
        </div>

        <div class="field">
          <label>Tarehe ya Kuanza Maombi</label>
          <input
            type="date"
            id="application_start">
        </div>

        <div class="field">
          <label>Tarehe ya Mwisho wa Maombi</label>
          <input
            type="date"
            id="application_end">
        </div>

        <div class="field full">
          <label>Anwani ya Shule</label>
          <textarea
            id="address"
            placeholder="Andika anwani ya shule"></textarea>
        </div>

      </div>

      <button type="submit">
        Ongeza Shule
      </button>

    </form>

    <div id="message" class="message"></div>

  </div>


  <!-- SCHOOL LIST -->
  <div class="card">

    <h2>Orodha ya Shule</h2>

    <div id="loading" class="loading">
      Inapakia taarifa za shule...
    </div>

    <div class="table-container">

      <table id="schoolsTable" style="display:none;">

        <thead>
          <tr>
            <th>#</th>
            <th>Jina la Shule</th>
            <th>Mkoa</th>
            <th>Wilaya</th>
            <th>Aina</th>
            <th>Bei ya Fomu</th>
            <th>Simu</th>
            <th>Hali</th>
          </tr>
        </thead>

        <tbody id="schoolsBody"></tbody>

      </table>

    </div>

    <div id="empty" class="empty" style="display:none;">
      Hakuna shule iliyoongezwa bado.
    </div>

  </div>

</div>


<script>

  const form = document.getElementById("schoolForm");
  const message = document.getElementById("message");
  const schoolsBody = document.getElementById("schoolsBody");
  const schoolsTable = document.getElementById("schoolsTable");
  const loading = document.getElementById("loading");
  const empty = document.getElementById("empty");


  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display = "block";

  }


  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function formatMoney(value) {

    const number = Number(value || 0);

    return number.toLocaleString("en-US") + " TZS";

  }


  async function loadSchools() {

    loading.style.display = "block";
    schoolsTable.style.display = "none";
    empty.style.display = "none";

    try {

      const response =
        await fetch("/api/schools");

      const data =
        await response.json();


      if (!response.ok || !data.success) {

        throw new Error(
          data.message ||
          "Imeshindikana kupata shule."
        );

      }


      schoolsBody.innerHTML = "";


      if (!data.schools || data.schools.length === 0) {

        loading.style.display = "none";
        empty.style.display = "block";

        return;
      }


      data.schools.forEach((school, index) => {

        const row =
          document.createElement("tr");

        row.innerHTML = `

          <td>${index + 1}</td>

          <td>
            ${escapeHtml(school.name)}
          </td>

          <td>
            ${escapeHtml(school.region)}
          </td>

          <td>
            ${escapeHtml(school.district)}
          </td>

          <td>
            ${escapeHtml(school.school_type)}
          </td>

          <td>
            ${formatMoney(school.form_price)}
          </td>

          <td>
            ${escapeHtml(school.phone || "-")}
          </td>

          <td>
            ${escapeHtml(school.status || "active")}
          </td>

        `;

        schoolsBody.appendChild(row);

      });


      loading.style.display = "none";
      schoolsTable.style.display = "table";

    }

    catch (error) {

      console.error(
        "Load schools error:",
        error
      );

      loading.style.display = "none";

      showMessage(
        "Imeshindikana kupata taarifa za shule kutoka database.",
        "error"
      );

    }

  }


  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const schoolData = {

        name:
          document.getElementById("name").value.trim(),

        region:
          document.getElementById("region").value.trim(),

        district:
          document.getElementById("district").value.trim(),

        school_type:
          document.getElementById("school_type").value,

        form_price:
          document.getElementById("form_price").value,

        phone:
          document.getElementById("phone").value.trim(),

        email:
          document.getElementById("email").value.trim(),

        application_start:
          document.getElementById("application_start").value,

        application_end:
          document.getElementById("application_end").value,

        address:
          document.getElementById("address").value.trim()

      };


      try {

        const response =
          await fetch(
            "/api/schools",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(schoolData)

            }
          );


        const data =
          await response.json();


        if (!response.ok || !data.success) {

          throw new Error(
            data.message ||
            "Imeshindikana kuhifadhi shule."
          );

        }


        showMessage(
          "Shule imeongezwa kwa mafanikio na imehifadhiwa kwenye database.",
          "success"
        );


        form.reset();


        await loadSchools();

      }

      catch (error) {

        console.error(
          "Add school error:",
          error
        );

        showMessage(
          error.message ||
          "Imeshindikana kuhifadhi taarifa za shule.",
          "error"
        );

      }

    }
  );


  loadSchools();

</script>

</body>
</html>
