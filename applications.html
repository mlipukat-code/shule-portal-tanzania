<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Applications - Shule Portal Tanzania</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .header {
      background: #0d6efd;
      color: white;
      padding: 20px;
    }

    .header h1 {
      margin: 0 0 5px;
      font-size: 24px;
    }

    .header p {
      margin: 0;
      opacity: 0.9;
    }

    .container {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .stat h3 {
      margin: 0 0 8px;
      color: #6c757d;
      font-size: 14px;
    }

    .stat strong {
      font-size: 28px;
      color: #0d6efd;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      color: #0d6efd;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .filters input,
    .filters select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ced4da;
      border-radius: 7px;
      font-size: 15px;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1100px;
    }

    th,
    td {
      border-bottom: 1px solid #dee2e6;
      padding: 12px;
      text-align: left;
    }

    th {
      background: #e9f2ff;
      color: #0d6efd;
      white-space: nowrap;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .pending {
      background: #fff3cd;
      color: #664d03;
    }

    .approved {
      background: #d1e7dd;
      color: #0f5132;
    }

    .rejected {
      background: #f8d7da;
      color: #842029;
    }

    .paid {
      background: #d1e7dd;
      color: #0f5132;
    }

    .unpaid {
      background: #f8d7da;
      color: #842029;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #6c757d;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #0d6efd;
    }

    @media (max-width: 700px) {

      .stats {
        grid-template-columns: 1fr;
      }

      .filters {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Shule Portal Tanzania</h1>
    <p>Usimamizi wa Applications</p>
  </div>


  <div class="container">

    <!-- STATS -->

    <div class="stats">

      <div class="stat">
        <h3>Applications Zote</h3>
        <strong id="totalApplications">0</strong>
      </div>

      <div class="stat">
        <h3>Zilizosubiri</h3>
        <strong id="pendingApplications">0</strong>
      </div>

      <div class="stat">
        <h3>Zilizolipiwa</h3>
        <strong id="paidApplications">0</strong>
      </div>

    </div>


    <!-- FILTERS -->

    <div class="card">

      <h2>🔎 Tafuta Application</h2>

      <div class="filters">

        <input
          type="text"
          id="searchInput"
          placeholder="Tafuta namba, jina, mzazi au simu..."
        >

        <select id="statusFilter">

          <option value="">Hali zote</option>

          <option value="pending">
            Pending
          </option>

          <option value="approved">
            Approved
          </option>

          <option value="rejected">
            Rejected
          </option>

        </select>

      </div>

    </div>


    <!-- APPLICATIONS TABLE -->

    <div class="card">

      <h2>📋 Applications Zote</h2>

      <div class="table-container">

        <table>

          <thead>

            <tr>
              <th>#</th>
              <th>Application No.</th>
              <th>Shule</th>
              <th>Fomu</th>
              <th>Mwombaji</th>
              <th>Mzazi</th>
              <th>Simu</th>
              <th>Malipo</th>
              <th>Status</th>
              <th>Tarehe</th>
            </tr>

          </thead>

          <tbody id="applicationsTable">

            <tr>
              <td colspan="10" class="loading">
                Inapakia Applications...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>


<script>

  let allApplications = [];


  // ================================
  // LOAD APPLICATIONS
  // ================================

  async function loadApplications() {

    const table =
      document.getElementById(
        "applicationsTable"
      );

    try {

      const response =
        await fetch(
          "/api/applications"
        );

      const data =
        await response.json();


      if (!response.ok || !data.success) {

        throw new Error(
          data.message ||
          "Imeshindikana kupata Applications."
        );

      }


      allApplications =
        data.applications || [];


      updateStats();

      renderApplications(
        allApplications
      );

    }

    catch (error) {

      console.error(error);

      table.innerHTML = `

        <tr>

          <td
            colspan="10"
            class="empty"
          >
            ❌ ${error.message}

          </td>

        </tr>

      `;

    }

  }


  // ================================
  // UPDATE STATS
  // ================================

  function updateStats() {

    document.getElementById(
      "totalApplications"
    ).textContent =
      allApplications.length;


    document.getElementById(
      "pendingApplications"
    ).textContent =

      allApplications.filter(
        application =>
          application.status === "pending"
      ).length;


    document.getElementById(
      "paidApplications"
    ).textContent =

      allApplications.filter(
        application =>
          application.payment_status === "paid"
      ).length;

  }


  // ================================
  // RENDER APPLICATIONS
  // ================================

  function renderApplications(
    applications
  ) {

    const table =
      document.getElementById(
        "applicationsTable"
      );


    if (applications.length === 0) {

      table.innerHTML = `

        <tr>

          <td
            colspan="10"
            class="empty"
          >
            Hakuna Applications zilizohifadhiwa bado.

          </td>

        </tr>

      `;

      return;

    }


    table.innerHTML = "";


    applications.forEach(
      (application, index) => {

        const row =
          document.createElement("tr");


        const statusClass =
          application.status === "approved"
            ? "approved"
            : application.status === "rejected"
              ? "rejected"
              : "pending";


        const paymentClass =
          application.payment_status === "paid"
            ? "paid"
            : "unpaid";


        const date =
          application.created_at
            ? new Date(
                application.created_at
              ).toLocaleDateString(
                "sw-TZ"
              )
            : "-";


        row.innerHTML = `

          <td>
            ${index + 1}
          </td>

          <td>
            <strong>
              ${application.application_number}
            </strong>
          </td>

          <td>
            ${application.school_name}
          </td>

          <td>
            ${application.form_name}
          </td>

          <td>
            ${application.applicant_name}
          </td>

          <td>
            ${application.parent_name || "-"}
          </td>

          <td>
            ${application.parent_phone || "-"}
          </td>

          <td>

            <span class="badge ${paymentClass}">
              ${application.payment_status}
            </span>

          </td>

          <td>

            <span class="badge ${statusClass}">
              ${application.status}
            </span>

          </td>

          <td>
            ${date}
          </td>

        `;


        table.appendChild(row);

      }
    );

  }


  // ================================
  // FILTER APPLICATIONS
  // ================================

  function filterApplications() {

    const search =
      document
        .getElementById(
          "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    const status =
      document.getElementById(
        "statusFilter"
      ).value;


    const filtered =
      allApplications.filter(
        application => {

          const searchableText = `

            ${application.application_number || ""}

            ${application.applicant_name || ""}

            ${application.parent_name || ""}

            ${application.parent_phone || ""}

            ${application.school_name || ""}

            ${application.form_name || ""}

          `.toLowerCase();


          const matchesSearch =
            !search ||
            searchableText.includes(
              search
            );


          const matchesStatus =
            !status ||
            application.status === status;


          return (
            matchesSearch &&
            matchesStatus
          );

        }
      );


    renderApplications(
      filtered
    );

  }


  document
    .getElementById(
      "searchInput"
    )
    .addEventListener(
      "input",
      filterApplications
    );


  document
    .getElementById(
      "statusFilter"
    )
    .addEventListener(
      "change",
      filterApplications
    );


  // ================================
  // START
  // ================================

  loadApplications();

</script>

</body>
</html>
