<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>School Forms - Shule Portal Tanzania</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .header {
      background: #0d6efd;
      color: white;
      padding: 20px;
    }

    .header h1 {
      margin: 0 0 5px;
      font-size: 24px;
    }

    .header p {
      margin: 0;
      opacity: 0.9;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      color: #0d6efd;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    .field label {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .field input,
    .field select {
      padding: 11px;
      border: 1px solid #ced4da;
      border-radius: 7px;
      font-size: 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    button {
      background: #0d6efd;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    button:hover {
      background: #0b5ed7;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      display: none;
    }

    .success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th,
    td {
      border-bottom: 1px solid #dee2e6;
      padding: 12px;
      text-align: left;
    }

    th {
      background: #e9f2ff;
      color: #0d6efd;
    }

    .badge {
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: #d1e7dd;
      color: #0f5132;
    }

    .empty {
      text-align: center;
      padding: 20px;
      color: #6c757d;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Shule Portal Tanzania</h1>
    <p>Usimamizi wa Fomu za Shule</p>
  </div>

  <div class="container">

    <div class="card">

      <h2>➕ Ongeza Fomu ya Shule</h2>

      <form id="formAdd">

        <div class="form-grid">

          <div class="field">
            <label>Shule</label>

            <select id="school_id" required>
              <option value="">-- Chagua Shule --</option>
            </select>
          </div>


          <div class="field">
            <label>Aina ya Fomu</label>

            <input
              type="text"
              id="form_name"
              placeholder="Mfano: Fomu ya Kidato cha Kwanza"
              required
            >
          </div>


          <div class="field">
            <label>Bei ya Fomu (TZS)</label>

            <input
              type="number"
              id="price"
              min="0"
              placeholder="Mfano: 10000"
              required
            >
          </div>


          <div class="field">
            <label>Hali ya Fomu</label>

            <select id="status">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>


          <div class="field">
            <label>Tarehe ya Kuanza</label>

            <input
              type="date"
              id="application_start"
            >
          </div>


          <div class="field">
            <label>Tarehe ya Mwisho</label>

            <input
              type="date"
              id="application_end"
            >
          </div>


          <div class="field full">

            <button type="submit">
              💾 Hifadhi Fomu
            </button>

          </div>

        </div>

      </form>

      <div id="message" class="message"></div>

    </div>


    <div class="card">

      <h2>📋 Fomu Zilizopo</h2>

      <div class="table-container">

        <table>

          <thead>

            <tr>
              <th>#</th>
              <th>Shule</th>
              <th>Aina ya Fomu</th>
              <th>Bei</th>
              <th>Hali</th>
              <th>Kuanza</th>
              <th>Mwisho</th>
            </tr>

          </thead>

          <tbody id="formsTable">

            <tr>
              <td colspan="7" class="empty">
                Inapakia...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>


<script>

  // ================================
  // LOAD SCHOOLS
  // ================================

  async function loadSchools() {

    try {

      const response =
        await fetch("/api/schools");

      const data =
        await response.json();

      const select =
        document.getElementById("school_id");

      select.innerHTML =
        '<option value="">-- Chagua Shule --</option>';

      if (data.success && data.schools.length > 0) {

        data.schools.forEach(school => {

          const option =
            document.createElement("option");

          option.value =
            school.id;

          option.textContent =
            school.name +
            " - " +
            school.region;

          select.appendChild(option);

        });

      }

    }

    catch (error) {

      console.error(error);

    }

  }


  // ================================
  // LOAD FORMS
  // ================================

  async function loadForms() {

    const table =
      document.getElementById("formsTable");

    try {

      const response =
        await fetch("/api/school-forms");

      const data =
        await response.json();

      if (
        !data.success ||
        data.forms.length === 0
      ) {

        table.innerHTML = `
          <tr>
            <td colspan="7" class="empty">
              Hakuna fomu zilizohifadhiwa bado.
            </td>
          </tr>
        `;

        return;

      }


      table.innerHTML = "";


      data.forms.forEach((form, index) => {

        const row =
          document.createElement("tr");

        row.innerHTML = `

          <td>${index + 1}</td>

          <td>${form.school_name}</td>

          <td>${form.form_name}</td>

          <td>
            TZS ${Number(form.price).toLocaleString()}
          </td>

          <td>
            <span class="badge">
              ${form.status}
            </span>
          </td>

          <td>
            ${form.application_start || "-"}
          </td>

          <td>
            ${form.application_end || "-"}
          </td>

        `;

        table.appendChild(row);

      });

    }

    catch (error) {

      console.error(error);

      table.innerHTML = `
        <tr>
          <td colspan="7" class="empty">
            Imeshindikana kupakia fomu.
          </td>
        </tr>
      `;

    }

  }


  // ================================
  // ADD FORM
  // ================================

  document
    .getElementById("formAdd")
    .addEventListener("submit", async function(event) {

      event.preventDefault();


      const message =
        document.getElementById("message");


      const payload = {

        school_id:
          document.getElementById("school_id").value,

        form_name:
          document.getElementById("form_name").value,

        price:
          document.getElementById("price").value,

        status:
          document.getElementById("status").value,

        application_start:
          document.getElementById("application_start").value,

        application_end:
          document.getElementById("application_end").value

      };


      try {

        const response =
          await fetch(
            "/api/school-forms",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(payload)
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.message ||
            "Imeshindikana kuhifadhi fomu."
          );

        }


        message.className =
          "message success";

        message.style.display =
          "block";

        message.textContent =
          "✅ " + data.message;


        document
          .getElementById("formAdd")
          .reset();


        await loadForms();

      }

      catch (error) {

        message.className =
          "message error";

        message.style.display =
          "block";

        message.textContent =
          "❌ " + error.message;

      }

    });


  // ================================
  // START
  // ================================

  loadSchools();

  loadForms();

</script>

</body>
</html>
