<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Tafuta Shule - Shule Portal Tanzania</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    header {
      background: #0b5ed7;
      color: white;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .back-link {
      color: white;
      text-decoration: none;
      background: rgba(255,255,255,0.15);
      padding: 9px 13px;
      border-radius: 8px;
    }

    main {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .hero {
      background: white;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.07);
      margin-bottom: 20px;
    }

    .hero h1 {
      margin-top: 0;
      margin-bottom: 8px;
      color: #0b5ed7;
    }

    .hero p {
      margin-bottom: 0;
      color: #64748b;
    }

    .filters {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.07);
      margin-bottom: 20px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #0b5ed7;
    }

    .status {
      margin: 15px 0;
      padding: 12px;
      border-radius: 9px;
      display: none;
    }

    .status.loading {
      display: block;
      background: #e8f1ff;
      color: #0b5ed7;
    }

    .status.error {
      display: block;
      background: #fee2e2;
      color: #b91c1c;
    }

    .status.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0 12px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .results-header h2 {
      margin: 0;
    }

    .school-count {
      color: #64748b;
    }

    .schools-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .school-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.07);
      transition: transform 0.15s ease,
                  box-shadow 0.15s ease;
    }

    .school-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 22px rgba(0,0,0,0.10);
    }

    .school-name {
      color: #0b5ed7;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .school-info {
      margin: 8px 0;
      color: #475569;
    }

    .school-info strong {
      color: #1f2937;
    }

    .price {
      margin-top: 14px;
      font-size: 18px;
      font-weight: bold;
      color: #198754;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      text-decoration: none;
      display: inline-block;
      padding: 11px 15px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .btn-primary {
      background: #0b5ed7;
      color: white;
    }

    .btn-secondary {
      background: #e9ecef;
      color: #212529;
    }

    .empty {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 14px;
      color: #64748b;
      box-shadow: 0 3px 15px rgba(0,0,0,0.07);
    }

    footer {
      margin-top: 40px;
      padding: 25px;
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }

      .hero {
        padding: 20px;
      }

      .school-card {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-inner">

      <div class="logo">
        🏫 Shule Portal Tanzania
      </div>

      <a
        href="/"
        class="back-link"
      >
        ← Mwanzo
      </a>

    </div>
  </header>


  <main>

    <section class="hero">

      <h1>Tafuta Shule</h1>

      <p>
        Tafuta shule, angalia taarifa zake na endelea
        kwenye mchakato wa kuomba fomu mtandaoni.
      </p>

    </section>


    <section class="filters">

      <div class="filter-grid">

        <div>
          <label for="search">
            Tafuta kwa jina
          </label>

          <input
            type="text"
            id="search"
            placeholder="Mfano: Mlipuka Academy"
          >
        </div>


        <div>
          <label for="region">
            Mkoa
          </label>

          <select id="region">
            <option value="">
              Mikoa yote
            </option>
          </select>
        </div>


        <div>
          <label for="district">
            Wilaya
          </label>

          <select id="district">
            <option value="">
              Wilaya zote
            </option>
          </select>
        </div>

      </div>

    </section>


    <div
      id="status"
      class="status"
    ></div>


    <div class="results-header">

      <h2>
        Shule Zinazopatikana
      </h2>

      <div
        id="schoolCount"
        class="school-count"
      >
        Shule 0
      </div>

    </div>


    <section
      id="schoolsGrid"
      class="schools-grid"
    ></section>

  </main>


  <footer>

    © 2026 Shule Portal Tanzania

  </footer>


  <script>

    const API_URL = "/api/schools";

    let schools = [];


    // ==========================================
    // ELEMENTS
    // ==========================================

    const searchInput =
      document.getElementById("search");

    const regionSelect =
      document.getElementById("region");

    const districtSelect =
      document.getElementById("district");

    const schoolsGrid =
      document.getElementById("schoolsGrid");

    const schoolCount =
      document.getElementById("schoolCount");

    const statusBox =
      document.getElementById("status");


    // ==========================================
    // STATUS
    // ==========================================

    function showStatus(
      message,
      type
    ) {

      statusBox.textContent =
        message;

      statusBox.className =
        "status " + type;
    }


    function hideStatus() {

      statusBox.textContent = "";

      statusBox.className =
        "status";
    }


    // ==========================================
    // LOAD SCHOOLS
    // ==========================================

    async function loadSchools() {

      showStatus(
        "Inapakia taarifa za shule...",
        "loading"
      );

      try {

        const response =
          await fetch(API_URL);

        if (!response.ok) {

          throw new Error(
            "HTTP " + response.status
          );
        }

        const data =
          await response.json();

        if (!data.success) {

          throw new Error(
            data.message ||
            "Imeshindikana kupata shule."
          );
        }

        schools =
          Array.isArray(data.schools)
            ? data.schools
            : [];

        populateRegions();

        populateDistricts();

        renderSchools();

        if (schools.length > 0) {

          showStatus(
            "Taarifa za shule zimepatikana.",
            "success"
          );

          setTimeout(
            hideStatus,
            2500
          );

        } else {

          showStatus(
            "Hakuna shule iliyosajiliwa kwa sasa.",
            "error"
          );
        }

      } catch (error) {

        console.error(
          "Load schools error:",
          error
        );

        showStatus(
          "Imeshindikana kupata shule. Tafadhali jaribu tena.",
          "error"
        );

        schoolsGrid.innerHTML = "";

        schoolCount.textContent =
          "Shule 0";
      }
    }


    // ==========================================
    // REGIONS
    // ==========================================

    function populateRegions() {

      const regions =
        [...new Set(
          schools
            .map(
              school =>
                school.region
            )
            .filter(Boolean)
        )]
        .sort();

      regionSelect.innerHTML = `
        <option value="">
          Mikoa yote
        </option>
      `;

      regions.forEach(
        region => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            region;

          option.textContent =
            region;

          regionSelect.appendChild(
            option
          );
        }
      );
    }


    // ==========================================
    // DISTRICTS
    // ==========================================

    function populateDistricts() {

      const selectedRegion =
        regionSelect.value;

      const filtered =
        selectedRegion
          ? schools.filter(
              school =>
                school.region ===
                selectedRegion
            )
          : schools;

      const districts =
        [...new Set(
          filtered
            .map(
              school =>
                school.district
            )
            .filter(Boolean)
        )]
        .sort();

      districtSelect.innerHTML = `
        <option value="">
          Wilaya zote
        </option>
      `;

      districts.forEach(
        district => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            district;

          option.textContent =
            district;

          districtSelect.appendChild(
            option
          );
        }
      );
    }


    // ==========================================
    // FILTER
    // ==========================================

    function getFilteredSchools() {

      const search =
        searchInput.value
          .trim()
          .toLowerCase();

      const region =
        regionSelect.value;

      const district =
        districtSelect.value;

      return schools.filter(
        school => {

          const name =
            String(
              school.name || ""
            ).toLowerCase();

          const schoolRegion =
            String(
              school.region || ""
            );

          const schoolDistrict =
            String(
              school.district || ""
            );

          const matchesSearch =
            !search ||
            name.includes(search);

          const matchesRegion =
            !region ||
            schoolRegion === region;

          const matchesDistrict =
            !district ||
            schoolDistrict === district;

          return (
            matchesSearch &&
            matchesRegion &&
            matchesDistrict
          );
        }
      );
    }


    // ==========================================
    // RENDER
    // ==========================================

    function renderSchools() {

      const filtered =
        getFilteredSchools();

      schoolCount.textContent =
        `Shule ${filtered.length}`;

      schoolsGrid.innerHTML = "";

      if (filtered.length === 0) {

        schoolsGrid.innerHTML = `
          <div class="empty">
            <h3>
              Hakuna shule inayolingana
            </h3>

            <p>
              Jaribu kubadilisha jina,
              mkoa au wilaya unayotafuta.
            </p>
          </div>
        `;

        return;
      }


      filtered.forEach(
        school => {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "school-card";


          const price =
            Number(
              school.form_price ??
              school.price ??
              0
            );


          const formattedPrice =
            price.toLocaleString(
              "en-US"
            );


          card.innerHTML = `

            <div class="school-name">
              ${escapeHtml(
                school.name ||
                "Jina halijapatikana"
              )}
            </div>


            <div class="school-info">
              <strong>Mkoa:</strong>
              ${escapeHtml(
                school.region ||
                "-"
              )}
            </div>


            <div class="school-info">
              <strong>Wilaya:</strong>
              ${escapeHtml(
                school.district ||
                "-"
              )}
            </div>


            <div class="school-info">
              <strong>Aina:</strong>
              ${escapeHtml(
                school.school_type ||
                school.type ||
                "-"
              )}
            </div>


            <div class="school-info">
              <strong>Simu:</strong>
              ${escapeHtml(
                school.phone ||
                "-"
              )}
            </div>


            <div class="school-info">
              <strong>Anwani:</strong>
              ${escapeHtml(
                school.address ||
                "-"
              )}
            </div>


            <div class="price">
              Fomu:
              TSh ${formattedPrice}
            </div>


            <div class="actions">

              <a
                class="btn btn-primary"
                href="/school-details.html?id=${encodeURIComponent(
                  school.id
                )}"
              >
                Taarifa zaidi
              </a>


              <a
                class="btn btn-secondary"
                href="/buy-form.html?school_id=${encodeURIComponent(
                  school.id
                )}"
              >
                Nunua Fomu
              </a>

            </div>

          `;

          schoolsGrid.appendChild(
            card
          );
        }
      );
    }


    // ==========================================
    // ESCAPE HTML
    // ==========================================

    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll(
          "'",
          "&#039;"
        );
    }


    // ==========================================
    // EVENTS
    // ==========================================

    searchInput.addEventListener(
      "input",
      renderSchools
    );


    regionSelect.addEventListener(
      "change",
      () => {

        populateDistricts();

        districtSelect.value = "";

        renderSchools();

      }
    );


    districtSelect.addEventListener(
      "change",
      renderSchools
    );


    // ==========================================
    // START
    // ==========================================

    loadSchools();

  </script>

</body>
</html>
