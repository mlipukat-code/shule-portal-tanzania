<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tafuta Shule - Shule Portal Tanzania</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #0b5ed7;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 7px 0 0;
      font-size: 14px;
    }

    .container {
      width: 94%;
      max-width: 1000px;
      margin: 25px auto;
    }

    .search-box {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .search-box h2 {
      margin-top: 0;
      color: #0b5ed7;
      font-size: 20px;
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    .search-input:focus {
      border-color: #0b5ed7;
    }

    .search-button {
      padding: 14px 22px;
      background: #0b5ed7;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .search-button:hover {
      background: #084298;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .filters select {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      font-size: 14px;
    }

    .result-info {
      margin-bottom: 15px;
      font-weight: bold;
      color: #555;
    }

    .schools {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .school-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .school-card h3 {
      margin-top: 0;
      color: #0b5ed7;
      font-size: 21px;
    }

    .school-info {
      line-height: 1.8;
      font-size: 14px;
      color: #444;
    }

    .price {
      color: #198754;
      font-weight: bold;
      font-size: 17px;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .btn {
      flex: 1;
      padding: 12px 8px;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
    }

    .btn-info {
      background: #0b5ed7;
      color: white;
    }

    .btn-buy {
      background: #198754;
      color: white;
    }

    .message {
      background: white;
      padding: 30px 15px;
      text-align: center;
      border-radius: 12px;
      color: #666;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #555;
    }

    @media (max-width: 650px) {

      .search-row {
        flex-direction: column;
      }

      .search-button {
        width: 100%;
      }

      .filters {
        flex-direction: column;
      }

      .schools {
        grid-template-columns: 1fr;
      }

      .buttons {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🏫 Shule Portal Tanzania</h1>
  <p>Tafuta shule na uombe fomu mtandaoni</p>
</header>

<div class="container">

  <div class="search-box">

    <h2>🔎 Tafuta Shule</h2>

    <div class="search-row">

      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Andika jina la shule..."
      >

      <button
        type="button"
        class="search-button"
        onclick="searchSchools()"
      >
        🔎 Tafuta
      </button>

    </div>

    <div class="filters">

      <select id="regionFilter" onchange="searchSchools()">
        <option value="">Mikoa yote</option>
      </select>

      <select id="districtFilter" onchange="searchSchools()">
        <option value="">Wilaya zote</option>
      </select>

    </div>

  </div>

  <div id="resultInfo" class="result-info"></div>

  <div id="schoolsContainer">
    <div class="loading">
      Inapakia shule...
    </div>
  </div>

</div>

<script>

  const API_URL = "/api/schools";

  let allSchools = [];

  async function loadSchools() {

    const container = document.getElementById("schoolsContainer");

    try {

      const response = await fetch(API_URL);

      if (!response.ok) {
        throw new Error("Imeshindikana kupata shule.");
      }

      const data = await response.json();

      if (!data.success || !Array.isArray(data.schools)) {
        throw new Error("Taarifa za shule hazipo.");
      }

      allSchools = data.schools;

      createRegionList();
      createDistrictList();

      searchSchools();

    } catch (error) {

      console.error(error);

      container.innerHTML = `
        <div class="message">
          <h3>Imeshindikana kupata shule</h3>
          <p>Tafadhali jaribu tena baadae.</p>
        </div>
      `;
    }
  }


  function createRegionList() {

    const select = document.getElementById("regionFilter");

    const regions = [
      ...new Set(
        allSchools
          .map(school => school.region)
          .filter(Boolean)
      )
    ].sort();

    regions.forEach(region => {

      const option = document.createElement("option");

      option.value = region;
      option.textContent = region;

      select.appendChild(option);

    });
  }


  function createDistrictList() {

    const select = document.getElementById("districtFilter");

    const districts = [
      ...new Set(
        allSchools
          .map(school => school.district)
          .filter(Boolean)
      )
    ].sort();

    districts.forEach(district => {

      const option = document.createElement("option");

      option.value = district;
      option.textContent = district;

      select.appendChild(option);

    });
  }


  function searchSchools() {

    const searchText =
      document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    const region =
      document.getElementById("regionFilter").value;

    const district =
      document.getElementById("districtFilter").value;

    const filtered = allSchools.filter(school => {

      const name =
        String(school.name || "").toLowerCase();

      const schoolRegion =
        String(school.region || "");

      const schoolDistrict =
        String(school.district || "");

      const matchesName =
        searchText === "" ||
        name.includes(searchText);

      const matchesRegion =
        region === "" ||
        schoolRegion === region;

      const matchesDistrict =
        district === "" ||
        schoolDistrict === district;

      return (
        matchesName &&
        matchesRegion &&
        matchesDistrict
      );

    });

    displaySchools(filtered);
  }


  function formatMoney(amount) {

    if (
      amount === null ||
      amount === undefined ||
      amount === ""
    ) {
      return "Haijawekwa";
    }

    const number = Number(amount);

    if (isNaN(number)) {
      return amount;
    }

    return "TSh " + number.toLocaleString("en-TZ");
  }


  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function displaySchools(schools) {

    const container =
      document.getElementById("schoolsContainer");

    const resultInfo =
      document.getElementById("resultInfo");

    resultInfo.textContent =
      `Shule zilizopatikana: ${schools.length}`;


    if (schools.length === 0) {

      container.innerHTML = `
        <div class="message">

          <h3>Hakuna shule iliyopatikana</h3>

          <p>
            Hakikisha umeandika jina sahihi la shule.
          </p>

        </div>
      `;

      return;
    }


    container.innerHTML = `

      <div class="schools">

        ${schools.map(school => `

          <div class="school-card">

            <h3>
              ${escapeHtml(school.name)}
            </h3>

            <div class="school-info">

              <div>
                📍 <strong>Mkoa:</strong>
                ${escapeHtml(school.region || "Haijawekwa")}
              </div>

              <div>
                📍 <strong>Wilaya:</strong>
                ${escapeHtml(school.district || "Haijawekwa")}
              </div>

              <div>
                🏫 <strong>Aina:</strong>
                ${escapeHtml(
                  school.school_type ||
                  school.type ||
                  "Haijawekwa"
                )}
              </div>

              <div>
                📞 <strong>Simu:</strong>
                ${escapeHtml(school.phone || "Haijawekwa")}
              </div>

              <div>
                💰 <strong>Bei ya Fomu:</strong>
                <span class="price">
                  ${formatMoney(
                    school.form_price ||
                    school.price
                  )}
                </span>
              </div>

            </div>

            <div class="buttons">

              <a
                class="btn btn-info"
                href="/school-details.html?id=${encodeURIComponent(school.id)}"
              >
                ℹ️ Taarifa zaidi
              </a>

              <a
                class="btn btn-buy"
                href="/buy-form.html?school_id=${encodeURIComponent(school.id)}"
              >
                📝 Nunua Fomu
              </a>

            </div>

          </div>

        `).join("")}

      </div>

    `;
  }


  document
    .getElementById("searchInput")
    .addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        searchSchools();
      }

    });


  loadSchools();

</script>

</body>
</html>
