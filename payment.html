<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Malipo - Shule Portal Tanzania</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8fb;
      color: #222;
    }

    header {
      background: #0b78b8;
      color: white;
      padding: 18px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      width: 92%;
      max-width: 700px;
      margin: 25px auto;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .school-name {
      color: #0b78b8;
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .school-info {
      color: #555;
      line-height: 1.7;
    }

    .title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 18px;
      color: #333;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 11px 0;
      border-bottom: 1px solid #eee;
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      color: #666;
    }

    .value {
      font-weight: bold;
      text-align: right;
    }

    .amount {
      background: #eaf6ff;
      border: 2px solid #0b78b8;
      border-radius: 10px;
      padding: 18px;
      text-align: center;
      margin-top: 18px;
    }

    .amount small {
      display: block;
      color: #555;
      margin-bottom: 5px;
    }

    .amount strong {
      font-size: 30px;
      color: #0b78b8;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    .btn-pay {
      background: #0b78b8;
      color: white;
    }

    .btn-pay:hover {
      background: #095f91;
    }

    .btn-back {
      background: #eee;
      color: #333;
    }

    .loading,
    .error {
      text-align: center;
      padding: 30px;
    }

    .error {
      color: #b00020;
    }

    footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      padding: 25px 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>🏫 Shule Portal Tanzania</h1>
  <p>Malipo ya Fomu ya Maombi</p>
</header>

<div class="container">

  <div id="loading" class="card loading">
    Inapakia taarifa...
  </div>

  <div id="content" style="display:none;">

    <!-- SCHOOL -->
    <div class="card">
      <div class="school-name" id="schoolName"></div>

      <div class="school-info">
        <div><strong>Mkoa:</strong> <span id="schoolRegion"></span></div>
        <div><strong>Wilaya:</strong> <span id="schoolDistrict"></span></div>
        <div><strong>Aina ya Shule:</strong> <span id="schoolType"></span></div>
        <div><strong>Simu:</strong> <span id="schoolPhone"></span></div>
      </div>
    </div>

    <!-- APPLICANT -->
    <div class="card">

      <div class="title">
        👤 Taarifa za Mwombaji
      </div>

      <div class="row">
        <span class="label">Jina la mwanafunzi</span>
        <span class="value" id="studentName"></span>
      </div>

      <div class="row">
        <span class="label">Darasa/Form</span>
        <span class="value" id="classLevel"></span>
      </div>

      <div class="row">
        <span class="label">Jinsia</span>
        <span class="value" id="gender"></span>
      </div>

      <div class="row">
        <span class="label">Jina la mzazi/mlezi</span>
        <span class="value" id="parentName"></span>
      </div>

      <div class="row">
        <span class="label">Simu</span>
        <span class="value" id="phone"></span>
      </div>

      <div class="row">
        <span class="label">Barua pepe</span>
        <span class="value" id="email"></span>
      </div>

    </div>

    <!-- PAYMENT -->
    <div class="card">

      <div class="title">
        💳 Muhtasari wa Malipo
      </div>

      <div class="row">
        <span class="label">Huduma</span>
        <span class="value">Fomu ya Maombi</span>
      </div>

      <div class="row">
        <span class="label">Shule</span>
        <span class="value" id="paymentSchool"></span>
      </div>

      <div class="amount">
        <small>Jumla ya Kulipa</small>
        <strong id="amount"></strong>
      </div>

      <button class="btn btn-pay" onclick="continuePayment()">
        💳 Endelea na Malipo
      </button>

      <button class="btn btn-back" onclick="history.back()">
        ← Rudi
      </button>

    </div>

  </div>

  <div id="errorBox" class="card error" style="display:none;"></div>

</div>

<footer>
  © 2026 Shule Portal Tanzania
</footer>

<script>

  const params = new URLSearchParams(window.location.search);

  const schoolId = params.get("school_id");

  const studentName = params.get("student_name") || "";
  const gender = params.get("gender") || "";
  const dateOfBirth = params.get("date_of_birth") || "";
  const classLevel = params.get("class_level") || "";
  const parentName = params.get("parent_name") || "";
  const phone = params.get("phone") || "";
  const email = params.get("email") || "";
  const address = params.get("address") || "";

  async function loadPaymentPage() {

    if (!schoolId) {
      showError("Taarifa ya shule haijapatikana.");
      return;
    }

    try {

      const response = await fetch("/api/schools");

      const data = await response.json();

      if (!data.success || !data.schools) {
        showError("Imeshindikana kupata taarifa za shule.");
        return;
      }

      const school = data.schools.find(
        s => String(s.id) === String(schoolId)
      );

      if (!school) {
        showError("Shule uliyochagua haijapatikana.");
        return;
      }

      // SCHOOL
      document.getElementById("schoolName").textContent =
        school.name || "-";

      document.getElementById("schoolRegion").textContent =
        school.region || "-";

      document.getElementById("schoolDistrict").textContent =
        school.district || "-";

      document.getElementById("schoolType").textContent =
        school.school_type || school.type || "-";

      document.getElementById("schoolPhone").textContent =
        school.phone || "-";

      // APPLICANT
      document.getElementById("studentName").textContent =
        studentName || "-";

      document.getElementById("classLevel").textContent =
        classLevel || "-";

      document.getElementById("gender").textContent =
        gender || "-";

      document.getElementById("parentName").textContent =
        parentName || "-";

      document.getElementById("phone").textContent =
        phone || "-";

      document.getElementById("email").textContent =
        email || "-";

      // PAYMENT
      document.getElementById("paymentSchool").textContent =
        school.name || "-";

      const price = Number(school.form_price || school.price || 0);

      document.getElementById("amount").textContent =
        "TSh " + price.toLocaleString("en-TZ");

      // Save school information temporarily
      sessionStorage.setItem(
        "selectedSchool",
        JSON.stringify(school)
      );

      // Show page
      document.getElementById("loading").style.display = "none";
      document.getElementById("content").style.display = "block";

    } catch (error) {

      console.error(error);

      showError(
        "Kuna tatizo la kuwasiliana na mfumo. Tafadhali jaribu tena."
      );
    }
  }


  function continuePayment() {

    const nextUrl =
      "/payment-confirmation.html?" +
      "school_id=" + encodeURIComponent(schoolId) +
      "&student_name=" + encodeURIComponent(studentName) +
      "&gender=" + encodeURIComponent(gender) +
      "&date_of_birth=" + encodeURIComponent(dateOfBirth) +
      "&class_level=" + encodeURIComponent(classLevel) +
      "&parent_name=" + encodeURIComponent(parentName) +
      "&phone=" + encodeURIComponent(phone) +
      "&email=" + encodeURIComponent(email) +
      "&address=" + encodeURIComponent(address);

    window.location.href = nextUrl;
  }


  function showError(message) {

    document.getElementById("loading").style.display = "none";

    const errorBox = document.getElementById("errorBox");

    errorBox.textContent = message;

    errorBox.style.display = "block";
  }


  loadPaymentPage();

</script>

</body>
</html>
