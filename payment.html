<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lipia Fomu - Shule Portal Tanzania</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    header {
      background: #0b5ed7;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    header p {
      margin: 0;
      font-size: 14px;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      color: #0b5ed7;
    }

    .summary {
      background: #f8fafc;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 8px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      color: #6b7280;
    }

    .value {
      font-weight: bold;
      text-align: right;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 16px;
      background: white;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #0b5ed7;
    }

    .amount {
      font-size: 26px;
      color: #0b5ed7;
      font-weight: bold;
    }

    .info {
      margin-top: 18px;
      padding: 12px;
      background: #eaf3ff;
      border-radius: 7px;
      font-size: 14px;
      color: #174a7c;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #0b5ed7;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.92;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .success {
      background: #d1e7dd;
      color: #0f5132;
    }

    @media (max-width: 500px) {
      .container {
        margin-top: 15px;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Shule Portal Tanzania</h1>
  <p>Malipo ya Fomu ya Maombi</p>
</header>

<div class="container">

  <div class="card">

    <h2>Fanya Malipo</h2>

    <div id="loading">
      Inapakia taarifa za ombi...
    </div>

    <div id="paymentContent" style="display:none;">

      <div class="summary">

        <div class="row">
          <span class="label">Application Number</span>
          <span class="value" id="applicationNumber">-</span>
        </div>

        <div class="row">
          <span class="label">Mwombaji</span>
          <span class="value" id="applicantName">-</span>
        </div>

        <div class="row">
          <span class="label">Shule</span>
          <span class="value" id="schoolName">-</span>
        </div>

        <div class="row">
          <span class="label">Fomu</span>
          <span class="value" id="formName">-</span>
        </div>

        <div class="row">
          <span class="label">Kiasi</span>
          <span class="value amount" id="amount">TZS 0</span>
        </div>

      </div>

      <label for="network">
        Chagua Mtandao wa Simu
      </label>

      <select id="network">

        <option value="">
          -- Chagua mtandao --
        </option>

        <option value="vodacom">
          Vodacom M-Pesa
        </option>

        <option value="airtel">
          Airtel Money
        </option>

        <option value="tigo">
          Tigo Pesa
        </option>

        <option value="halopesa">
          HaloPesa
        </option>

      </select>

      <label for="phone">
        Namba ya Simu
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="Mfano: 0712345678"
        maxlength="15"
      >

      <div class="info">
        Baada ya kuunganisha payment gateway, taarifa hizi
        zitatumika kuanzisha ombi la malipo kupitia mtandao
        uliochagua.
      </div>

      <button id="payButton" onclick="startPayment()">
        Endelea na Malipo
      </button>

      <div id="message" class="message"></div>

    </div>

  </div>

</div>

<script>

  const API_APPLICATIONS = "/api/applications";

  let application = null;


  function showMessage(message, type) {

    const box = document.getElementById("message");

    box.textContent = message;

    box.className =
      "message " +
      type;

    box.style.display = "block";
  }


  function formatAmount(amount) {

    return Number(amount || 0)
      .toLocaleString("sw-TZ");

  }


  async function loadApplication() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const applicationId =
      params.get("application_id");


    if (!applicationId) {

      document.getElementById("loading").textContent =
        "Application ID haijapatikana.";

      return;

    }


    try {

      const response =
        await fetch(API_APPLICATIONS);

      if (!response.ok) {

        throw new Error(
          "Imeshindikana kupata taarifa za maombi."
        );

      }


      const data =
        await response.json();


      const applications =
        Array.isArray(data)
          ? data
          : Array.isArray(data.applications)
          ? data.applications
          : [];


      application =
        applications.find(
          item =>
            String(item.id) ===
            String(applicationId)
        );


      if (!application) {

        document.getElementById("loading").textContent =
          "Ombi halijapatikana.";

        return;

      }


      document.getElementById(
        "applicationNumber"
      ).textContent =
        application.application_number || "-";


      document.getElementById(
        "applicantName"
      ).textContent =
        application.applicant_name || "-";


      document.getElementById(
        "schoolName"
      ).textContent =
        application.school_name || "-";


      document.getElementById(
        "formName"
      ).textContent =
        application.form_name || "-";


      document.getElementById(
        "amount"
      ).textContent =
        "TZS " +
        formatAmount(
          application.amount ||
          application.form_price ||
          0
        );


      document.getElementById(
        "paymentContent"
      ).style.display = "block";


      document.getElementById(
        "loading"
      ).style.display = "none";


    } catch (error) {

      console.error(error);

      document.getElementById("loading").textContent =
        "Kuna tatizo la kupata taarifa za ombi.";

    }

  }


  async function startPayment() {

    const network =
      document.getElementById(
        "network"
      ).value;


    const phone =
      document.getElementById(
        "phone"
      ).value.trim();


    if (!network) {

      showMessage(
        "Tafadhali chagua mtandao wa simu.",
        "error"
      );

      return;

    }


    if (!phone) {

      showMessage(
        "Tafadhali weka namba ya simu.",
        "error"
      );

      return;

    }


    if (!application) {

      showMessage(
        "Taarifa za ombi hazijapatikana.",
        "error"
      );

      return;

    }


    const button =
      document.getElementById(
        "payButton"
      );


    button.disabled = true;

    button.textContent =
      "Inaandaa malipo...";


    /*
      HAPA TUTAUNGANISHA FLUTTERWAVE
      BAADA YA KUWEKA SERVER-SIDE API.

      Kwa sasa hatusemi malipo yamefanyika.
    */


    setTimeout(() => {

      button.disabled = false;

      button.textContent =
        "Endelea na Malipo";


      showMessage(
        "Ukurasa wa malipo umeandaliwa. Payment gateway bado haijaunganishwa.",
        "success"
      );

    }, 800);

  }


  loadApplication();

</script>

</body>
</html>
