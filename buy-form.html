<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nunua Fomu - Shule Portal Tanzania</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #0b5ed7;
      color: white;
      text-align: center;
      padding: 22px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 7px 0 0;
      font-size: 14px;
    }

    .container {
      width: 94%;
      max-width: 650px;
      margin: 25px auto;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .school-name {
      text-align: center;
      color: #0b5ed7;
      font-size: 26px;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .info {
      background: #f7f9fc;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .label {
      color: #666;
    }

    .value {
      font-weight: bold;
      text-align: right;
    }

    .price {
      color: #198754;
      font-size: 21px;
    }

    .section-title {
      font-size: 18px;
      color: #0b5ed7;
      margin-top: 25px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      margin-top: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #0b5ed7;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 15px;
      margin-top: 22px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary {
      background: #198754;
      color: white;
    }

    .btn-primary:hover {
      background: #146c43;
    }

    .btn-back {
      display: block;
      text-align: center;
      text-decoration: none;
      color: #0b5ed7;
      margin-top: 18px;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      padding: 35px;
      color: #555;
    }

    .error {
      background: #f8d7da;
      color: #842029;
      padding: 18px;
      border-radius: 10px;
      text-align: center;
    }

    .notice {
      background: #e7f5ff;
      color: #084298;
      padding: 15px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      margin-top: 20px;
    }

    .price-warning {
      background: #fff3cd;
      color: #664d03;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 14px;
      display: none;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {

      .card {
        padding: 18px;
      }

      .school-name {
        font-size: 22px;
      }

      .info-row {
        flex-direction: column;
        gap: 4px;
      }

      .value {
        text-align: left;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🏫 Shule Portal Tanzania</h1>
  <p>Maombi ya Kujiunga na Shule</p>
</header>

<div class="container">

  <div id="content">

    <div class="loading">
      Inapakia taarifa za shule...
    </div>

  </div>

</div>

<script>

  const API_URL = "/api/schools";

  let selectedSchool = null;
  let selectedPrice = 0;


  // ================================
  // ESCAPE HTML
  // ================================

  function escapeHtml(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  // ================================
  // FORMAT MONEY
  // ================================

  function formatMoney(amount) {

    if (
      amount === null ||
      amount === undefined ||
      amount === ""
    ) {
      return "TSh 0";
    }

    const number = Number(amount);

    if (
      isNaN(number) ||
      number < 0
    ) {
      return "TSh 0";
    }

    return "TSh " +
      number.toLocaleString("en-TZ");
  }


  // ================================
  // GET REAL SCHOOL PRICE
  // ================================

  function getSchoolPrice(school) {

    if (!school) {
      return 0;
    }

    /*
      API inaweza kurudisha:
      form_price
      au
      price
    */

    let rawPrice = school.form_price;

    if (
      rawPrice === null ||
      rawPrice === undefined ||
      rawPrice === ""
    ) {
      rawPrice = school.price;
    }

    const price = Number(rawPrice);

    if (
      isNaN(price) ||
      price < 0
    ) {
      return 0;
    }

    return price;
  }


  // ================================
  // FORMAT DATE
  // ================================

  function formatDate(dateString) {

    if (!dateString) {
      return "Haijawekwa";
    }

    const date = new Date(dateString);

    if (isNaN(date.getTime())) {
      return dateString;
    }

    return date.toLocaleDateString(
      "sw-TZ",
      {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      }
    );
  }


  // ================================
  // LOAD SCHOOL
  // ================================

  async function loadSchool() {

    const content =
      document.getElementById("content");

    try {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const schoolId =
        params.get("school_id");


      // ================================
      // SCHOOL ID CHECK
      // ================================

      if (!schoolId) {

        content.innerHTML = `

          <div class="card">

            <div class="error">

              <h3>Shule haijachaguliwa</h3>

              <p>
                Tafadhali rudi kwenye ukurasa
                wa kutafuta shule.
              </p>

            </div>

            <a
              class="btn-back"
              href="/schools-public.html"
            >
              ← Rudi Kutafuta Shule
            </a>

          </div>

        `;

        return;
      }


      // ================================
      // FETCH SCHOOLS
      // ================================

      const response =
        await fetch(
          API_URL,
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "Imeshindikana kupata taarifa za shule."
        );

      }


      const data =
        await response.json();


      if (
        !data.success ||
        !Array.isArray(data.schools)
      ) {

        throw new Error(
          "Taarifa za shule hazijapatikana."
        );

      }


      // ================================
      // FIND SCHOOL
      // ================================

      selectedSchool =
        data.schools.find(
          school =>
            String(school.id) ===
            String(schoolId)
        );


      if (!selectedSchool) {

        content.innerHTML = `

          <div class="card">

            <div class="error">

              <h3>Shule haijapatikana</h3>

              <p>
                Shule uliyochagua haipo
                kwenye mfumo.
              </p>

            </div>

            <a
              class="btn-back"
              href="/schools-public.html"
            >
              ← Rudi Kutafuta Shule
            </a>

          </div>

        `;

        return;
      }


      // ================================
      // GET REAL PRICE
      // ================================

      selectedPrice =
        getSchoolPrice(selectedSchool);


      console.log(
        "School:",
        selectedSchool.name
      );

      console.log(
        "Form price:",
        selectedPrice
      );


      // ================================
      // PRICE WARNING
      // ================================

      let priceWarning = "";

      if (selectedPrice <= 0) {

        priceWarning = `

          <div
            class="price-warning"
            style="display:block;"
          >
            ⚠️ Bei ya fomu haijawekwa
            vizuri kwenye mfumo.
            Tafadhali usiendelee mpaka
            bei iwe imewekwa.
          </div>

        `;

      }


      // ================================
      // DISPLAY PAGE
      // ================================

      content.innerHTML = `

        <div class="card">

          <h2 class="school-name">
            ${escapeHtml(
              selectedSchool.name
            )}
          </h2>

          <p class="subtitle">
            Nunua fomu ya maombi ya kujiunga
          </p>


          <div class="info">

            <div class="info-row">

              <span class="label">
                🏫 Shule
              </span>

              <span class="value">
                ${escapeHtml(
                  selectedSchool.name
                )}
              </span>

            </div>


            <div class="info-row">

              <span class="label">
                📍 Mkoa
              </span>

              <span class="value">
                ${escapeHtml(
                  selectedSchool.region ||
                  "Haijawekwa"
                )}
              </span>

            </div>


            <div class="info-row">

              <span class="label">
                📍 Wilaya
              </span>

              <span class="value">
                ${escapeHtml(
                  selectedSchool.district ||
                  "Haijawekwa"
                )}
              </span>

            </div>


            <div class="info-row">

              <span class="label">
                🏫 Aina ya Shule
              </span>

              <span class="value">
                ${escapeHtml(
                  selectedSchool.school_type ||
                  selectedSchool.type ||
                  "Haijawekwa"
                )}
              </span>

            </div>


            <div class="info-row">

              <span class="label">
                💰 Bei ya Fomu
              </span>

              <span class="value price">
                ${formatMoney(
                  selectedPrice
                )}
              </span>

            </div>


            <div class="info-row">

              <span class="label">
                📅 Maombi yanaanza
              </span>

              <span class="value">
                ${formatDate(
                  selectedSchool.application_start
                )}
              </span>

            </div>


            <div class="info-row">

              <span class="label">
                📅 Maombi yanafunga
              </span>

              <span class="value">
                ${formatDate(
                  selectedSchool.application_end
                )}
              </span>

            </div>

          </div>


          ${priceWarning}


          <h3 class="section-title">
            👨‍🎓 Taarifa za Mwombaji
          </h3>


          <form
            id="applicationForm"
            onsubmit="continueApplication(event)"
          >


            <label for="studentName">
              Jina kamili la mwanafunzi
            </label>

            <input
              type="text"
              id="studentName"
              placeholder="Andika jina kamili"
              required
            >


            <label for="phone">
              Namba ya simu ya mzazi/mlezi
            </label>

            <input
              type="tel"
              id="phone"
              placeholder="Mfano: 0712345678"
              required
            >


            <label for="email">
              Barua pepe
            </label>

            <input
              type="email"
              id="email"
              placeholder="Mfano: mzazi@email.com"
            >


            <label for="classLevel">
              Darasa/Kidato anachoomba
            </label>

            <select
              id="classLevel"
              required
            >

              <option value="">
                Chagua darasa/kidato
              </option>

              <option value="Awali">
                Awali
              </option>

              <option value="Darasa la 1">
                Darasa la 1
              </option>

              <option value="Darasa la 2">
                Darasa la 2
              </option>

              <option value="Darasa la 3">
                Darasa la 3
              </option>

              <option value="Darasa la 4">
                Darasa la 4
              </option>

              <option value="Darasa la 5">
                Darasa la 5
              </option>

              <option value="Darasa la 6">
                Darasa la 6
              </option>

              <option value="Darasa la 7">
                Darasa la 7
              </option>

              <option value="Kidato cha 1">
                Kidato cha 1
              </option>

              <option value="Kidato cha 2">
                Kidato cha 2
              </option>

              <option value="Kidato cha 3">
                Kidato cha 3
              </option>

              <option value="Kidato cha 4">
                Kidato cha 4
              </option>

              <option value="Kidato cha 5">
                Kidato cha 5
              </option>

              <option value="Kidato cha 6">
                Kidato cha 6
              </option>

            </select>


            <div class="notice">

              <strong>
                Hatua inayofuata:
              </strong>

              <br>

              Taarifa zako zitatumwa
              pamoja na taarifa za shule
              uliyochagua.

              <br><br>

              💰
              <strong>
                Kiasi cha fomu:
                ${formatMoney(selectedPrice)}
              </strong>

            </div>


            <button
              type="submit"
              class="btn btn-primary"
              ${selectedPrice <= 0 ? "disabled" : ""}
            >
              ➜ Endelea na Maombi
            </button>

          </form>


          <a
            class="btn-back"
            href="/schools-public.html"
          >
            ← Rudi Kutafuta Shule
          </a>

        </div>

      `;

    } catch (error) {

      console.error(
        "LOAD SCHOOL ERROR:",
        error
      );


      content.innerHTML = `

        <div class="card">

          <div class="error">

            <h3>
              Hitilafu imetokea
            </h3>

            <p>
              Imeshindikana kupata taarifa
              za shule.
            </p>

          </div>

          <a
            class="btn-back"
            href="/schools-public.html"
          >
            ← Rudi Kutafuta Shule
          </a>

        </div>

      `;

    }

  }


  // ================================
  // CONTINUE APPLICATION
  // ================================

  function continueApplication(event) {

    event.preventDefault();


    if (!selectedSchool) {

      alert(
        "Taarifa za shule hazijapatikana."
      );

      return;
    }


    // ================================
    // CHECK PRICE
    // ================================

    if (
      !selectedPrice ||
      Number(selectedPrice) <= 0
    ) {

      alert(
        "Bei ya fomu haijawekwa vizuri. Tafadhali wasiliana na admin wa shule."
      );

      return;
    }


    // ================================
    // GET FORM DATA
    // ================================

    const studentName =
      document
        .getElementById(
          "studentName"
        )
        .value
        .trim();


    const phone =
      document
        .getElementById(
          "phone"
        )
        .value
        .trim();


    const email =
      document
        .getElementById(
          "email"
        )
        .value
        .trim();


    const classLevel =
      document
        .getElementById(
          "classLevel"
        )
        .value;


    // ================================
    // VALIDATION
    // ================================

    if (!studentName) {

      alert(
        "Tafadhali andika jina la mwanafunzi."
      );

      return;
    }


    if (!phone) {

      alert(
        "Tafadhali weka namba ya simu ya mzazi/mlezi."
      );

      return;
    }


    if (!classLevel) {

      alert(
        "Tafadhali chagua darasa/kidato."
      );

      return;
    }


    // ================================
    // BUILD URL
    // ================================

    const params =
      new URLSearchParams();


    params.set(
      "school_id",
      selectedSchool.id
    );


    params.set(
      "student_name",
      studentName
    );


    params.set(
      "phone",
      phone
    );


    params.set(
      "email",
      email
    );


    params.set(
      "class_level",
      classLevel
    );


    /*
      MUHIMU:

      Tunapitisha bei halisi ya shule
      kwenda application-form.html.

      Hii inasaidia frontend kuonyesha
      kiasi sahihi cha malipo.

      Backend bado inapaswa kuthibitisha
      bei kutoka database kabla ya kuhifadhi
      payment.
    */

    params.set(
      "form_price",
      String(selectedPrice)
    );


    params.set(
      "school_name",
      selectedSchool.name || ""
    );


    // ================================
    // GO TO APPLICATION FORM
    // ================================

    window.location.href =
      "/application-form.html?" +
      params.toString();

  }


  // ================================
  // START
  // ================================

  loadSchool();

</script>

</body>
</html>
