<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login - Shule Portal Tanzania</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #e3f2fd, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 32px 25px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      color: #0d47a1;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 17px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #1976d2;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #1976d2;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #90caf9;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      background: #ffebee;
      color: #c62828;
    }

    .success {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #777;
      font-size: 12px;
    }

  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      🏫
    </div>

    <h1>
      Shule Portal Tanzania
    </h1>

    <div class="subtitle">
      Ingia kama Admin Mkuu
    </div>


    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Weka email ya Admin"
        required
        autocomplete="username"
      >


      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Weka password"
        required
        autocomplete="current-password"
      >


      <button
        type="submit"
        id="loginButton"
      >
        Ingia
      </button>

    </form>


    <div id="message"></div>


    <div class="footer">
      © 2026 Shule Portal Tanzania
    </div>

  </div>


  <script>

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className = type;

      message.style.display = "block";

    }


    async function verifyToken(token) {

      try {

        const response = await fetch(
          "/api/admin/me",
          {
            method: "GET",

            headers: {
              "Authorization": "Bearer " + token
            },

            cache: "no-store"
          }
        );


        const data =
          await response.json();


        if (!response.ok || !data.admin) {

          return {
            success: false,
            message:
              data.message ||
              "Session ya Admin si sahihi."
          };

        }


        return {
          success: true,
          admin: data.admin
        };

      }

      catch (error) {

        console.error(
          "Token verification error:",
          error
        );


        return {
          success: false,
          message:
            "Imeshindikana kuthibitisha Admin."
        };

      }

    }


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();


        const password =
          document
            .getElementById("password")
            .value;


        loginButton.disabled = true;

        loginButton.textContent =
          "Inaingia...";

        message.style.display =
          "none";


        /*
         * LOGIN
         */

        try {

          const response =
            await fetch(
              "/api/admin/login",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  email: email,
                  password: password
                }),

                cache: "no-store"
              }
            );


          let data = {};

          try {

            data =
              await response.json();

          }

          catch (jsonError) {

            throw new Error(
              "Server imetoa majibu yasiyo sahihi."
            );

          }


          if (!response.ok) {

            throw new Error(
              data.message ||
              data.error ||
              "Email au password si sahihi."
            );

          }


          /*
           * CHUKUA TOKEN
           */

          const token =
            data.token ||
            data.accessToken ||
            data.sessionToken;


          if (!token) {

            throw new Error(
              "Login imepokelewa lakini server haikurudisha Admin token."
            );

          }


          /*
           * HIFADHI TOKEN
           */

          localStorage.setItem(
            "admin_token",
            token
          );


          /*
           * THIBITISHA TOKEN
           */

          showMessage(
            "Login imefanikiwa. Inathibitisha session...",
            "success"
          );


          const verification =
            await verifyToken(token);


          if (!verification.success) {

            localStorage.removeItem(
              "admin_token"
            );


            throw new Error(
              verification.message ||
              "Token haijathibitishwa."
            );

          }


          /*
           * LOGIN IMEKAMILIKA
           */

          showMessage(
            "✅ Umeingia kikamilifu. Inafungua Admin Dashboard...",
            "success"
          );


          setTimeout(
            function() {

              window.location.replace(
                "/admin-dashboard.html"
              );

            },
            500
          );

        }


        catch (error) {

          console.error(
            "Login error:",
            error
          );


          localStorage.removeItem(
            "admin_token"
          );


          showMessage(
            error.message ||
            "Kuna tatizo wakati wa
