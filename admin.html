<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Login - Shule Portal Tanzania</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(
        135deg,
        #e3f2fd,
        #ffffff
      );

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;

      background: white;

      padding: 32px 25px;

      border-radius: 16px;

      box-shadow:
        0 8px 30px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;

      font-size: 45px;

      margin-bottom: 10px;
    }

    h1 {
      text-align: center;

      color: #0d47a1;

      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;

      color: #666;

      margin-bottom: 25px;

      font-size: 14px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-weight: bold;

      color: #333;
    }

    input {
      width: 100%;

      padding: 13px;

      border: 1px solid #ccc;

      border-radius: 8px;

      margin-bottom: 17px;

      font-size: 16px;
    }

    input:focus {
      outline: none;

      border-color: #1976d2;

      box-shadow:
        0 0 0 2px rgba(25,118,210,0.12);
    }

    button {
      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 8px;

      background: #1976d2;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;
    }

    button:disabled {
      background: #90caf9;

      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;

      padding: 12px;

      border-radius: 8px;

      display: none;

      text-align: center;

      font-size: 14px;

      line-height: 1.5;
    }

    .error {
      background: #ffebee;

      color: #c62828;
    }

    .success {
      background: #e8f5e9;

      color: #2e7d32;
    }

    .info {
      background: #e3f2fd;

      color: #1565c0;
    }

    .footer {
      text-align: center;

      margin-top: 22px;

      color: #777;

      font-size: 12px;
    }

  </style>

</head>

<body>

  <div class="login-box">

    <div class="logo">
      🏫
    </div>

    <h1>
      Shule Portal Tanzania
    </h1>

    <div class="subtitle">
      Ingia kama Admin Mkuu
    </div>


    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Weka email ya Admin"
        autocomplete="username"
        required
      >


      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Weka password"
        autocomplete="current-password"
        required
      >


      <button
        type="submit"
        id="loginButton"
      >
        Ingia
      </button>

    </form>


    <div id="message"></div>


    <div class="footer">
      © 2026 Shule Portal Tanzania
    </div>

  </div>


<script>

console.log("ADMIN LOGIN SCRIPT IMEANZA");


const loginForm =
  document.getElementById("loginForm");


const loginButton =
  document.getElementById("loginButton");


const message =
  document.getElementById("message");


// =====================================================
// MESSAGE
// =====================================================

function showMessage(
  text,
  type
) {

  message.textContent = text;

  message.className = type;

  message.style.display = "block";

}


// =====================================================
// LOGIN
// =====================================================

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const email =
      document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();


    const password =
      document
        .getElementById("password")
        .value;


    if (!email) {

      showMessage(
        "Tafadhali weka email.",
        "error"
      );

      return;
    }


    if (!password) {

      showMessage(
        "Tafadhali weka password.",
        "error"
      );

      return;
    }


    loginButton.disabled = true;

    loginButton.textContent =
      "Inathibitisha...";


    showMessage(
      "Inaunganisha na server...",
      "info"
    );


    try {

      console.log(
        "Sending login request..."
      );


      const response =
        await fetch(
          "/api/admin/login",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "Accept":
                "application/json"
            },

            body:
              JSON.stringify({
                email: email,
                password: password
              }),

            cache: "no-store"
          }
        );


      console.log(
        "Login response status:",
        response.status
      );


      const responseText =
        await response.text();


      console.log(
        "Login response:",
        responseText
      );


      let data;


      try {

        data =
          JSON.parse(
            responseText
          );

      }

      catch (jsonError) {

        throw new Error(
          "Server imerudisha jibu lisilo sahihi. HTTP Status: " +
          response.status
        );

      }


      if (!response.ok) {

        throw new Error(
          data.message ||
          data.error ||
          "Login imekataliwa."
        );

      }


      if (
        !data.token
      ) {

        throw new Error(
          "Login imejibu bila Admin Token."
        );

      }


      // Save token

      localStorage.setItem(
        "admin_token",
        data.token
      );


      showMessage(
        "Login imefanikiwa. Inafungua Dashboard...",
        "success"
      );


      loginButton.textContent =
        "Imefanikiwa";


      // =================================================
      // VERIFY ADMIN
      // =================================================

      const verifyResponse =
        await fetch(
          "/api/admin/me",
          {
            method: "GET",

            headers: {
              "Authorization":
                "Bearer " + data.token,

              "Accept":
                "application/json"
            },

            cache: "no-store"
          }
        );


      console.log(
        "Verification status:",
        verifyResponse.status
      );


      const verifyText =
        await verifyResponse.text();


      console.log(
        "Verification response:",
        verifyText
      );


      if (!verifyResponse.ok) {

        localStorage.removeItem(
          "admin_token"
        );


        throw new Error(
          "Token ya Admin haijathibitishwa."
        );

      }


      let verifyData;


      try {

        verifyData =
          JSON.parse(
            verifyText
          );

      }

      catch (error) {

        localStorage.removeItem(
          "admin_token"
        );

        throw new Error(
          "Server imeshindwa kuthibitisha Admin."
        );

      }


      if (
        !verifyData.success
      ) {

        localStorage.removeItem(
          "admin_token"
        );

        throw new Error(
          verifyData.message ||
          "Admin verification imegoma."
        );

      }


      // =================================================
      // GO DASHBOARD
      // =================================================

      setTimeout(
        function() {

          window.location.href =
            "/admin-dashboard.html";

        },
        700
      );

    }


    catch (error) {

      console.error(
        "LOGIN ERROR:",
        error
      );


      showMessage(
        error.message ||
        "Kuna tatizo wakati wa login.",
        "error"
      );


      loginButton.disabled = false;

      loginButton.textContent =
        "Ingia";

    }

  }
);


// =====================================================
// TEST SCRIPT
// =====================================================

showMessage(
  "Mfumo wa login uko tayari.",
  "info"
);

</script>

</body>
</html>
