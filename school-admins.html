<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shule Portal Tanzania - School Admins</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f8fb;
      color: #222;
    }

    header {
      background: #0879c9;
      color: white;
      padding: 18px;
    }

    header h1 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      width: 95%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 15px;
      color: #0879c9;
      text-decoration: none;
      font-weight: bold;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      color: #0879c9;
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input,
    select {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
      width: 100%;
      background: white;
    }

    button {
      background: #0879c9;
      color: white;
      border: none;
      padding: 13px 22px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      margin-top: 18px;
    }

    button:hover {
      background: #0565a8;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      display: none;
    }

    .success {
      background: #dff5e5;
      color: #176b2c;
    }

    .error {
      background: #fde1e1;
      color: #a40000;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #0879c9;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #0879c9;
      color: white;
    }

    tr:hover {
      background: #f5faff;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    .status {
      font-weight: bold;
    }

    @media (max-width: 700px) {

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .card {
        padding: 16px;
      }

      header h1 {
        font-size: 19px;
      }

    }
  </style>
</head>

<body>

<header>

  <h1>Shule Portal Tanzania</h1>

  <p>
    Usimamizi wa School Admins
  </p>

</header>


<div class="container">

  <a
    href="admin-dashboard.html"
    class="back"
  >
    ← Rudi Dashboard
  </a>


  <!-- ADD ADMIN -->

  <div class="card">

    <h2>
      Ongeza School Admin
    </h2>


    <form id="adminForm">

      <div class="form-grid">


        <div class="field">

          <label>
            Jina Kamili *
          </label>

          <input
            type="text"
            id="full_name"
            required
            placeholder="Mfano: John Mwakalinga"
          >

        </div>


        <div class="field">

          <label>
            Email *
          </label>

          <input
            type="email"
            id="email"
            required
            placeholder="admin@shule.co.tz"
          >

        </div>


        <div class="field">

          <label>
            Namba ya Simu
          </label>

          <input
            type="text"
            id="phone"
            placeholder="0712345678"
          >

        </div>


        <div class="field">

          <label>
            Shule *
          </label>

          <select
            id="school_id"
            required
          >

            <option value="">
              Inapakia shule...
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            Password ya Mwanzo *
          </label>

          <input
            type="password"
            id="password"
            required
            minlength="6"
            placeholder="Angalau herufi 6"
          >

        </div>


      </div>


      <button type="submit">
        Ongeza School Admin
      </button>

    </form>


    <div
      id="message"
      class="message"
    ></div>

  </div>



  <!-- ADMIN LIST -->

  <div class="card">

    <h2>
      Orodha ya School Admins
    </h2>


    <div
      id="loading"
      class="loading"
    >
      Inapakia School Admins...
    </div>


    <div class="table-container">

      <table
        id="adminsTable"
        style="display:none;"
      >

        <thead>

          <tr>

            <th>#</th>

            <th>Jina</th>

            <th>Email</th>

            <th>Simu</th>

            <th>Shule</th>

            <th>Hali</th>

          </tr>

        </thead>


        <tbody
          id="adminsBody"
        ></tbody>

      </table>

    </div>


    <div
      id="empty"
      class="empty"
      style="display:none;"
    >
      Hakuna School Admin aliyeongezwa bado.
    </div>

  </div>

</div>



<script>

  const adminForm =
    document.getElementById("adminForm");

  const message =
    document.getElementById("message");

  const schoolSelect =
    document.getElementById("school_id");

  const adminsBody =
    document.getElementById("adminsBody");

  const adminsTable =
    document.getElementById("adminsTable");

  const loading =
    document.getElementById("loading");

  const empty =
    document.getElementById("empty");



  function showMessage(
    text,
    type
  ) {

    message.textContent =
      text;

    message.className =
      "message " + type;

    message.style.display =
      "block";

  }



  function escapeHtml(
    value
  ) {

    if (
      value === null ||
      value === undefined
    ) {

      return "";

    }


    return String(value)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }



  // ================================
  // LOAD SCHOOLS
  // ================================

  async function loadSchools() {

    try {

      const response =
        await fetch(
          "/api/schools"
        );


      const data =
        await response.json();


      if (
        !response.ok ||
        !data.success
      ) {

        throw new Error(
          "Imeshindikana kupata shule."
        );

      }


      schoolSelect.innerHTML =
        '<option value="">Chagua shule</option>';


      if (
        data.schools.length === 0
      ) {

        schoolSelect.innerHTML =
          '<option value="">Hakuna shule</option>';

        return;

      }


      data.schools.forEach(
        school => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            school.id;

          option.textContent =
            school.name +
            " - " +
            school.region;

          schoolSelect.appendChild(
            option
          );

        }
      );

    }

    catch (error) {

      console.error(
        "Load schools error:",
        error
      );

      schoolSelect.innerHTML =
        '<option value="">Imeshindikana kupata shule</option>';

    }

  }



  // ================================
  // LOAD ADMINS
  // ================================

  async function loadAdmins() {

    loading.style.display =
      "block";

    adminsTable.style.display =
      "none";

    empty.style.display =
      "none";


    try {

      const response =
        await fetch(
          "/api/school-admins"
        );


      const data =
        await response.json();


      if (
        !response.ok ||
        !data.success
      ) {

        throw new Error(
          "Imeshindikana kupata School Admins."
        );

      }


      adminsBody.innerHTML =
        "";


      if (
        !data.admins ||
        data.admins.length === 0
      ) {

        loading.style.display =
          "none";

        empty.style.display =
          "block";

        return;

      }


      data.admins.forEach(
        (admin, index) => {

          const row =
            document.createElement(
              "tr"
            );


          row.innerHTML = `

            <td>
              ${index + 1}
            </td>

            <td>
              ${escapeHtml(
                admin.full_name
              )}
            </td>

            <td>
              ${escapeHtml(
                admin.email
              )}
            </td>

            <td>
              ${escapeHtml(
                admin.phone || "-"
              )}
            </td>

            <td>
              ${escapeHtml(
                admin.school_name
              )}
            </td>

            <td class="status">
              ${escapeHtml(
                admin.status
              )}
            </td>

          `;


          adminsBody.appendChild(
            row
          );

        }
      );


      loading.style.display =
        "none";

      adminsTable.style.display =
        "table";

    }

    catch (error) {

      console.error(
        "Load admins error:",
        error
      );

      loading.style.display =
        "none";

      showMessage(
        "Imeshindikana kupata School Admins kutoka database.",
        "error"
      );

    }

  }



  // ================================
  // ADD ADMIN
  // ================================

  adminForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const adminData = {

        full_name:
          document
            .getElementById(
              "full_name"
            )
            .value
            .trim(),

        email:
          document
            .getElementById(
              "email"
            )
            .value
            .trim(),

        phone:
          document
            .getElementById(
              "phone"
            )
            .value
            .trim(),

        school_id:
          document
            .getElementById(
              "school_id"
            )
            .value,

        password:
          document
            .getElementById(
              "password"
            )
            .value

      };


      try {

        const response =
          await fetch(
            "/api/school-admins",
            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify(
                  adminData
                )

            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.message ||
            "Imeshindikana kuongeza School Admin."
          );

        }


        showMessage(
          "School Admin ameongezwa kwa mafanikio na kuhifadhiwa kwenye database.",
          "success"
        );


        adminForm.reset();


        await loadAdmins();

      }

      catch (error) {

        console.error(
          "Add admin error:",
          error
        );


        showMessage(
          error.message ||
          "Imeshindikana kuhifadhi School Admin.",
          "error"
        );

      }

    }
  );



  // ================================
  // START
  // ================================

  loadSchools();

  loadAdmins();

</script>

</body>
</html>
