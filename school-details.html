<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Taarifa za Shule - Shule Portal Tanzania</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .header {
      background: #0b5ed7;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 14px;
      opacity: 0.95;
    }

    .container {
      width: 94%;
      max-width: 800px;
      margin: 25px auto;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .school-name {
      color: #0b5ed7;
      font-size: 28px;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .info-box {
      background: #f7f9fc;
      border-radius: 10px;
      padding: 15px;
      border-left: 4px solid #0b5ed7;
    }

    .label {
      display: block;
      color: #666;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .value {
      font-size: 16px;
      font-weight: bold;
      color: #222;
    }

    .price {
      color: #198754;
      font-size: 20px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 200px;
      padding: 14px 18px;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }

    .btn-primary {
      background: #0b5ed7;
      color: white;
    }

    .btn-primary:hover {
      background: #084298;
    }

    .btn-secondary {
      background: #198754;
      color: white;
    }

    .btn-secondary:hover {
      background: #146c43;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #0b5ed7;
      text-decoration: none;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      padding: 40px 10px;
      font-size: 18px;
      color: #555;
    }

    .error {
      background: #f8d7da;
      color: #842029;
      padding: 18px;
      border-radius: 10px;
      text-align: center;
    }

    .success-note {
      margin-top: 20px;
      padding: 15px;
      background: #e7f5ff;
      border-radius: 10px;
      color: #084298;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      .info {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 18px;
      }

      .school-name {
        font-size: 23px;
      }

      .btn {
        min-width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🏫 Shule Portal Tanzania</h1>
    <p>Taarifa za Shule</p>
  </div>

  <div class="container">

    <div id="content">
      <div class="loading">
        Inapakia taarifa za shule...
      </div>
    </div>

  </div>

  <script>
    const API_URL = "/api/schools";

    function formatMoney(amount) {
      if (amount === null || amount === undefined || amount === "") {
        return "Haijawekwa";
      }

      const number = Number(amount);

      if (isNaN(number)) {
        return amount;
      }

      return "TSh " + number.toLocaleString("en-TZ");
    }

    function formatDate(dateString) {
      if (!dateString) {
        return "Haijawekwa";
      }

      const date = new Date(dateString);

      if (isNaN(date.getTime())) {
        return dateString;
      }

      return date.toLocaleDateString("sw-TZ", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    function escapeHtml(value) {
      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function loadSchool() {

      const content = document.getElementById("content");

      try {

        const params = new URLSearchParams(window.location.search);
        const schoolId = params.get("id");

        if (!schoolId) {

          content.innerHTML = `
            <div class="card">

              <div class="error">
                <h3>Shule haijachaguliwa</h3>
                <p>
                  Tafadhali rudi kwenye ukurasa wa kutafuta shule.
                </p>
              </div>

              <a class="back" href="/schools-public.html">
                ← Rudi Kutafuta Shule
              </a>

            </div>
          `;

          return;
        }

        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error("API haikupatikana.");
        }

        const data = await response.json();

        if (!data.success || !Array.isArray(data.schools)) {
          throw new Error("Taarifa za shule hazijapatikana.");
        }

        const school = data.schools.find(
          item => String(item.id) === String(schoolId)
        );

        if (!school) {

          content.innerHTML = `
            <div class="card">

              <div class="error">
                <h3>Shule haijapatikana</h3>
                <p>
                  Shule uliyochagua haipo kwenye mfumo
                  au haijawezeshwa.
                </p>
              </div>

              <a class="back" href="/schools-public.html">
                ← Rudi Kutafuta Shule
              </a>

            </div>
          `;

          return;
        }

        content.innerHTML = `

          <div class="card">

            <h2 class="school-name">
              ${escapeHtml(school.name)}
            </h2>

            <div class="info">

              <div class="info-box">
                <span class="label">Mkoa</span>
                <span class="value">
                  ${escapeHtml(school.region || "Haijawekwa")}
                </span>
              </div>

              <div class="info-box">
                <span class="label">Wilaya</span>
                <span class="value">
                  ${escapeHtml(school.district || "Haijawekwa")}
                </span>
              </div>

              <div class="info-box">
                <span class="label">Anwani</span>
                <span class="value">
                  ${escapeHtml(school.address || "Haijawekwa")}
                </span>
              </div>

              <div class="info-box">
                <span class="label">Simu</span>
                <span class="value">
                  ${escapeHtml(school.phone || "Haijawekwa")}
                </span>
              </div>

              <div class="info-box">
                <span class="label">Barua pepe</span>
                <span class="value">
                  ${escapeHtml(school.email || "Haijawekwa")}
                </span>
              </div>

              <div class="info-box">
                <span class="label">Aina ya Shule</span>
                <span class="value">
                  ${escapeHtml(
                    school.school_type ||
                    school.type ||
                    "Haijawekwa"
                  )}
                </span>
              </div>

              <div class="info-box">
                <span class="label">Bei ya Fomu</span>
                <span class="value price">
                  ${formatMoney(
                    school.form_price ||
                    school.price
                  )}
                </span>
              </div>

              <div class="info-box">
                <span class="label">Hali ya Maombi</span>
                <span class="value">
                  ${
                    school.status === "active"
                    ? "Maombi Yapo Wazi"
                    : "Maombi Yamefungwa"
                  }
                </span>
              </div>

              <div class="info-box">
                <span class="label">Maombi yanaanza</span>
                <span class="value">
                  ${formatDate(school.application_start)}
                </span>
              </div>

              <div class="info-box">
                <span class="label">Maombi yanafunga</span>
                <span class="value">
                  ${formatDate(school.application_end)}
                </span>
              </div>

            </div>

            <div class="success-note">

              <strong>Maelekezo:</strong><br>

              Kama unataka kuomba nafasi katika
              <strong>${escapeHtml(school.name)}</strong>,
              bonyeza <strong>Nunua Fomu</strong> ili
              kuanza kujaza taarifa za mwanafunzi.

            </div>

            <div class="buttons">

              <a
                class="btn btn-primary"
                href="/application-form.html?school_id=${encodeURIComponent(school.id)}"
              >
                📝 Nunua Fomu
              </a>

              <a
                class="btn btn-secondary"
                href="/application-form.html?school_id=${encodeURIComponent(school.id)}"
              >
                ➜ Endelea na Maombi
              </a>

            </div>

            <a
              class="back"
              href="/schools-public.html"
            >
              ← Rudi Kutafuta Shule
            </a>

          </div>

        `;

      } catch (error) {

        console.error(error);

        content.innerHTML = `

          <div class="card">

            <div class="error">

              <h3>Imeshindikana kupata taarifa</h3>

              <p>
                Kuna tatizo wakati wa kupata taarifa za shule.
              </p>

              <p>
                Tafadhali jaribu tena.
              </p>

            </div>

            <a
              class="back"
              href="/schools-public.html"
            >
              ← Rudi Kutafuta Shule
            </a>

          </div>

        `;
      }
    }

    loadSchool();
  </script>

</body>
</html>
